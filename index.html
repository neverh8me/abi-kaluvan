  return best && t - best.t < CURSOR_KEEP_MS ? cargoAtPoint(best.x, best.y) : null;
}

// Card of the hovered cargo: whether it can be red by label and price, before any sound
function showHover(rec) {
  const odds = cargoRedOdds(rec);
  const label = rec.label;
  const red = odds ? odds.red : null;
  const color = red === null ? '#8b93a1' : redColor(red);
  ui.result.style.borderColor = color;
  ui.result.style.background = color + '1a';
  const title = red === null ? tr('hover.title') : red >= 0.995 ? tr('card.red') : red > 0 ? tr('hover.maybe', { p: pct(red) }) : tr('hover.none');
  ui.result.innerHTML = `
    <div class="big" style="color:${color}">${title}</div>
    <div class="sub">${esc(cargoHead(rec))}. ${esc(tr('hover.drag'))}</div>
    ${red !== null ? chanceRow(red) : ''}
    ${odds && rec.price ? paybackRow(payback(odds.items, rec.price)) : ''}
    ${odds ? itemTiles(odds.items) : ''}`;
}

// "Rare Mystery Cargo · 2×2 · 470,000": what is known about the cargo
function cargoHead(rec) {
  return [rec.label && labelName(rec.label), normSize(`${rec.w}x${rec.h}`).replace('x', '×'), rec.price && fmtPrice(rec.price)]
    .filter(Boolean).join(' · ');
}

// Read the cargo label (asynchronously, with Tesseract). Crop now, as the frame will change.
function readLabel(rec, x, y, w, h) {
  if (rec.label || rec.labelBusy || (rec.labelTries || 0) >= LABEL_TRIES || typeof Ocr === 'undefined') return;
  rec.labelBusy = true;
  const crop = Ocr.labelCanvas(fullCanvas, x, y, w, h, P);
  readLabel.n = (readLabel.n || 0) + 1;
  Ocr.read(crop, readLabel.n % 2 ? 'label' : 'label2') // two readers in turn: labels appear twice as fast
    .then(text => {
      rec.labelTries = (rec.labelTries || 0) + 1;
      const label = Ocr.parseLabel(text);
      if (label) { rec.label = label; if (document.visibilityState === 'visible') drawMap(); }
    })
    .catch(e => { rec.labelTries = LABEL_TRIES; if (!readLabel.failed) log(tr('log.ocrFail', { msg: e.message || e })); readLabel.failed = true; })
    .finally(() => { rec.labelBusy = false; });
}

// ---------- Purchases ----------
// After a purchase the game writes above the grid: "nick spent 200,000 Koen on a mystery cargo and obtained [item]".
// Such lines also appear for other players' purchases, and nicknames are not stored at all. Own purchase is recognized
// by the balance below the grid ("Owned: 624,605"): it dropped by exactly the line amount, so you bought it.
// Then the cargo whose sound was heard and whose tooltip price matches the amount is looked up.
function readFeed(G, grid, now) {
  if (feedBusy || now - feedAt < FEED_MS || typeof Ocr === 'undefined' || !viewport) return;
  feedAt = now;
  const x = Math.max(0, Math.round(grid.x0)), w = Math.round(Math.min(grid.cols * P, G.w - x));
  const y = Math.max(0, Math.round(viewport.y - P * FEED_TOP)), h = Math.round(viewport.y - P * FEED_BOTTOM) - y;
  // the balance is in the right half below the list
  const bx = Math.round(grid.x0 + grid.cols * P * BALANCE_LEFT), bw = Math.round(Math.min(grid.x0 + grid.cols * P + P * 0.3, G.w) - bx);
  const by = Math.round(viewport.y + viewport.h), bh = Math.round(Math.min(G.h, by + P * BALANCE_BELOW) - by);
  const changed = (r, prev) => {
    if (r.w < P * 2 || r.h < P * 0.25) return null;
    const sig = Vision.crop(G, r.x, r.y, r.w, r.h);
    return prev && prev.length === sig.length && Vision.patchDiff(sig, prev) < 2 ? null : sig; // the same one: not read again
  };
  const feedR = { x, y, w, h }, balR = { x: bx, y: by, w: bw, h: bh };
  const fs = changed(feedR, feedSig), bs = changed(balR, balanceSig);
  if (!fs && !bs) { processFeed(); return; }
  if (fs) feedSig = fs;
  if (bs) balanceSig = bs;
  feedBusy = true;
  const read = r => Ocr.readData(Ocr.tipCanvas(fullCanvas, r.x, r.y, r.w, r.h, P), 'label').then(d => d.text);
  // the balance first: the purchase line and the balance drop usually appear together
  if (fs) diagFrame('feed');
  (bs ? read(balR).then(t => { const v = Ocr.parseBalance(t); diag(`balance area ${bx},${by} ${bw}x${bh}: "${t.trim()}" -> ${v}`); if (v) onBalance(v); }) : Promise.resolve())
    .then(() => fs ? read(feedR).then(t => { const f = Ocr.parseFeed(t); diag(`feed area ${x},${y} ${w}x${h}: "${t.trim()}" -> ${JSON.stringify(f)}`); if (f) onFeed(f); }) : null)
    .catch(e => { feedSig = balanceSig = null; diag('feed/balance read failed: ' + (e && e.message || e)); })
    .finally(() => { feedBusy = false; processFeed(); });
}

// Local diagnostics (diag/ in the app folder, never sent anywhere): what the purchase reading saw and decided
const DIAG = location.protocol.startsWith('http');
function diag(msg) {
  if (DIAG) fetch('api/diag', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: String(msg) }).catch(() => {});
}
function diagFrame() {
  if (DIAG && fullCanvas.width) fullCanvas.toBlob(b => { if (b) fetch('api/diagframe', { method: 'POST', body: b }).catch(() => {}); }, 'image/jpeg', 0.85);
}
setInterval(() => {
  if (stream) diag(`state: phase=${phase} P=${P && P.toFixed(1)} viewport=${JSON.stringify(viewport)} scrollbar=${!!sbKnown} cargo=${cargo.size} balance=${balance} spent=${spent} queue=${feedQueue.map(f => f.price + ' ' + f.item).join('; ')} lastParse=${Math.round((performance.now() - lastScan) / 1000)}s ago`);
}, 15000);

function onBalance(v) {
  if (balance !== null && v !== balance) diag(`balance ${balance} -> ${v}`);
  if (balance !== null && v < balance) spent += balance - v;
  balance = v;
}

// A feed line waits in the queue until the balance confirms (or refutes) the purchase.
// The same line read slightly differently ("Rebrut"/"Rebcut") is the same purchase: not added twice.
function onFeed(feed) {
  const now = performance.now();
  const dup = feedQueue.concat(feedDone).some(f => f.price === feed.price && now - f.at < FEED_SAME_MS && Ocr.matchName(f.item, [{ name: feed.item }]));
  if (!dup) feedQueue.push({ ...feed, at: now });
}

function processFeed() {
  const now = performance.now();
  for (const f of feedQueue) if (now - f.at >= FEED_WAIT_MS) diag(`feed line dropped, the balance never fell by ${f.price}: ${f.item} (spent=${spent})`);
  feedQueue = feedQueue.filter(f => now - f.at < FEED_WAIT_MS);
  feedDone = feedDone.filter(f => now - f.at < FEED_SAME_MS);
  for (const f of [...feedQueue]) {
    if (spent < f.price * (1 - BUY_MATCH)) continue; // the balance did not drop by this amount: someone else bought it
    spent = Math.max(0, spent - f.price);
    feedQueue.splice(feedQueue.indexOf(f), 1);
    feedDone.push(f);
    ownPurchase(f);
  }
}

function ownPurchase({ price, item }) {
  // What dropped is known from the line, so the bought cargo must fit it: its sound holds this item and its
  // size is the item's size. Many cargo share a price (200k, 250k…) and 1×1 cargo are not on the map at all,
  // so "the last sound heard" would often be another cargo's sound. Of several fitting cargo with this price
  // the one heard last is taken; if none fits, the hovered cargo of that label is taken without a sound (below).
  const named = [...itemById.values()].map(x => ({ name: x.nameEn || x.name, it: x }));
  const m = Ocr.matchName(item, named), it = m && m.it;
  const fits = (key, res) => {
    const rec = cargo.get(key), s = res && soundById(res.soundId);
    if (!rec || !s || !it) return false;
    return s.items.some(x => x.id === it.id) && normSize(`${rec.w}x${rec.h}`) === normSize(it.size);
  };
  const byPrice = [...results].filter(([key, res]) => {
    const rec = cargo.get(key);
    return rec && rec.price && !rec.bought && Math.abs(rec.price - price) <= price * BUY_MATCH && fits(key, res);
  }).sort((a, b) => (b[1].t || 0) - (a[1].t || 0))[0];
  let key = byPrice ? byPrice[0] : null, res = byPrice ? byPrice[1] : null;
  // the price was not read (no hover): the last sound heard within 3 min, but only if it fits the item
  if (!byPrice && lastResult && Date.now() - lastResult.t < 180e3 && lastResult.key && fits(lastResult.key, lastResult)) { key = lastResult.key; res = lastResult; }
  // bought without dragging: the hovered cargo with this price whose label pools hold the item and whose size
  // is the item's size (the one hovered last); it is recorded without a sound, with its label and price
  if (!key && it) {
    const byLabel = placedCargo().filter(([, r]) => r.price && !r.bought && r.label && Math.abs(r.price - price) <= price * BUY_MATCH
      && normSize(`${r.w}x${r.h}`) === normSize(it.size) && it.wl && it.wl[poolLabel(r.label)] > 0)
      .sort((a, b) => (b[1].hoverAt || 0) - (a[1].hoverAt || 0))[0];
    if (byLabel) key = byLabel[0];
  }
  const rec = key && cargo.get(key);
  diag(`purchase confirmed: ${price} "${item}" -> item ${it ? it.nameEn : "?"} (${it ? it.size : "-"}); cargo ${key || "none"} ${rec ? rec.w + "x" + rec.h + " " + (rec.label ? poolLabel(rec.label) : "no label") + " " + rec.price : ""}; sound ${res ? res.soundId : "none"}; priced cargo on map: ${placedCargo().filter(([, r]) => r.price).map(([k, r]) => k + "=" + r.price).join(" ")}`);
  recordPurchase({ soundId: res && res.soundId, size: rec ? normSize(`${rec.w}x${rec.h}`) : '', label: cargoInfo(rec), price, itemText: item, itemId: it ? it.id : null, key });
}

// Records from before this check may pair an item with another cargo's sound: such a sound is dropped
function dropMismatchedSounds() {
  let changed = false;
  purchases = purchases.map(b => {
    const s = b.soundId && soundById(b.soundId), it = b.itemId != null && itemById.get(b.itemId);
    const badSound = s && it && !s.items.some(x => x.id === b.itemId);
    const badSize = it && b.size && normSize(b.size) !== normSize(it.size); // a cargo of another size than the item
    if (!badSound && !badSize) return b;
    changed = true;
    return { ...b, soundId: null, label: '', size: '' }; // the whole cargo pairing was wrong, not only the sound
  });
  if (changed) { savePurchases(); syncBase(); }
}

// Records a purchase. itemId if the item is already known, otherwise it is looked up by name.
function recordPurchase({ soundId, size, label, price, itemText, itemId, key }) {
  const sound = soundId && soundById(soundId);
  let it = itemId != null ? itemById.get(itemId) || (sound && sound.items.find(x => String(x.id) === String(itemId))) : null;
  if (!it && itemText) {
    const named = list => list.map(x => ({ name: x.nameEn || x.name, it: x }));
    const m = (sound && Ocr.matchName(itemText, named(sound.items))) || Ocr.matchName(itemText, named([...itemById.values()]));
    it = m && m.it;
  }
  const rec = key && cargo.get(key);
  purchases.push({
    t: Date.now(), soundId: soundId || null, size: size || '',
    label: label && (label.mystery || label.category) ? labelName(label) : '',
    price: price || (rec && rec.price) || 0,
    itemId: it ? it.id : null, item: it ? it.nameEn || it.name : itemText || '', q: it ? it.q : '',
  });
  savePurchases();
  syncBase();
  if (rec) rec.bought = it || true;
  drawMap();
}

function savePurchases() {
  allCache = null;
  try { localStorage.setItem(PURCHASES_KEY, JSON.stringify(purchases)); } catch {}
}

// Shared base: from the app folder and the freshest from GitHub (if online), both merged
async function loadBase() {
  const get = async url => {
    try {
      const r = await fetch(url, { cache: 'no-cache' });
      if (!r.ok) return [];
      const data = await r.json();
      return Array.isArray(data.purchases) ? data.purchases : [];
    } catch { return []; }
  };
  const [local, remote] = await Promise.all([get(BASE_URL), get(BASE_REMOTE)]);
  basePurchases = mergePurchases(local, remote);
  allCache = null;
  syncBase(); // own purchases not yet in the local file (say, recorded before this version)
  drawMap();
}

// Own purchases go to a local file (purchases.mine.json via the local server), and from there
// sync.ps1 sends them to the shared server on the next launch. Without the server (site not via start.bat) this is skipped quietly.
let syncBusy = false;
const SHARE_LABELS = new Set(['', ...Object.values(MYSTERY_TIERS).map(t => t.name), 'Military Items', 'Medical Supplies', 'Computer Parts',
  'Collectibles', 'Instruments', 'Energy Items', 'Household Items', 'Building Materials', 'Electronics', 'Flammables', 'Tools', 'Paper',
  'Rare Collectibles', 'Uncommon Collectibles', 'Rare Medical Supplies', 'Uncommon Military Items']);
// A purchase is worth sharing with its sound (sound → item) or, bought without dragging, with the cargo
// label and price (label + price → item)
function shareable(b) {
  const it = b.itemId != null && itemById.get(b.itemId);
  const label = SHARE_LABELS.has(b.label) ? b.label : '';
  if (!it || !(b.soundId || (label && b.price))) return null;
  return { t: b.t, soundId: b.soundId || null, size: b.size || '', label, price: b.price || 0, itemId: b.itemId, item: it.nameEn || '', q: it.q || '' };
}
async function syncBase() {
  // before the library is loaded no purchase can be checked (shareable needs the item catalog): writing now
  // would empty the file, so wait — importLibrary calls this again
  if (syncBusy || !location.protocol.startsWith('http') || !itemById.size) return;
  syncBusy = true;
  // No free text into the shared base: item name from the catalog, label only a known one.
  // This way a nickname or any other piece of a screen line can never get in.
  const mine = purchases.map(shareable).filter(Boolean);
  try {
    await fetch('api/purchases', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Abi-Kaluvan': '1' },
      body: JSON.stringify({ updated: new Date().toISOString(), purchases: mine }, null, 1),
    });
  } catch {} finally { syncBusy = false; }
}

function cargoName(key) {
  const rec = cargo.get(key);
  return rec ? `${rec.R + 1 - mapBounds().minR}×${rec.C + 1 - mapBounds().minC}` : key;
}

function mapBounds() {
  const placed = placedCargo().map(([, r]) => r);
  if (!placed.length) return { minC: 0, minR: 0, maxC: 4, maxR: 3, placed };
  return {
    minC: Math.min(...placed.map(r => r.C)), minR: Math.min(...placed.map(r => r.R)),
    maxC: Math.max(...placed.map(r => r.C + r.w)), maxR: Math.max(...placed.map(r => r.R + r.h)), placed,
  };
}

// ---------- Stages ----------
function updateStage() {
  const count = placedCargo().length;
  ui.rescan.hidden = !(stream && count);
  ui.done.hidden = !(stream && count && phase === 'scan');
  let title, hint;
  if (!stream) { title = tr('stage.start'); hint = ''; }
  else if (!count) { title = tr('stage.open'); hint = tr('stage.openHint'); }
  else if (phase === 'scan') {
    title = tr('stage.scan', { n: count });
    hint = tr(sawEnd ? 'stage.scanHintEnd' : 'stage.scanHint');
  } else { title = tr('stage.ready', { n: count }); hint = tr('stage.readyHint'); }
  ui.stageTitle.textContent = title;
  ui.stageHint.textContent = hint;
}

// ---------- Map drawing ----------
function drawMap() {
  try { drawMapInner(); }
  catch (e) {
    if (!drawMap.failed) log(tr('log.mapFail', { msg: e.message }));
    drawMap.failed = true;
  }
}

function drawMapInner() {
  const { minC, minR, maxC, maxR, placed } = mapBounds();
  const W = placed.length ? Math.min(20, Math.max(1, maxC - minC)) * MAP_U : 360;
  const H = placed.length ? Math.min(MAP_MAX_ROWS, Math.max(1, maxR - minR)) * MAP_U : 120;
  if (ui.map.width !== W || ui.map.height !== H) { ui.map.width = W; ui.map.height = H; }
  const c = mapCtx;
  c.fillStyle = '#0b0c0f';
  c.fillRect(0, 0, W, H);
  if (!placed.length) {
    c.fillStyle = '#8b93a1'; c.font = '13px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(tr('map.empty'), W / 2, H / 2);
    renderBestBuys([]);
    return;
  }
  const keyOf = new Map(placed.map(r => [r, null]));
  for (const [key, rec] of placedCargo()) keyOf.set(rec, key);

  for (const rec of placed) {
    const key = keyOf.get(rec);
    const x = (rec.C - minC) * MAP_U, y = (rec.R - minR) * MAP_U, w = rec.w * MAP_U, h = rec.h * MAP_U;
    c.fillStyle = '#15181d';
    c.fillRect(x + 2, y + 2, w - 4, h - 4);
    if (rec.thumb) { c.globalAlpha = 0.35; c.drawImage(rec.thumb, x + 2, y + 2, w - 4, h - 4); c.globalAlpha = 1; }

    if (rec.bought) {
      // already bought: dimmed, with what dropped
      c.fillStyle = 'rgba(11,12,15,.7)';
      c.fillRect(x + 2, y + 2, w - 4, h - 4);
      if (rec.bought.img) { c.globalAlpha = 0.6; drawItemIcon(c, rec.bought, x + 8, y + 8, w - 16, h - 16); c.globalAlpha = 1; }
      c.strokeStyle = '#3a414d'; c.lineWidth = 1;
      c.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
      c.fillStyle = '#22c55e'; c.font = 'bold 14px system-ui, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
      c.fillText('✓', x + 6, y + 4);
      continue;
    }

    const r = results.get(key);
    const sound = r && soundById(r.soundId);
    const revealed = rec.revealed && qById[rec.revealed];
    const label = rec.label;
    if (!sound) {
      if (label && label.category && !revealed && !labelCanRed(label)) {
        // a category cargo whose pools hold no reds (Tools, Paper…): dimmed
        c.fillStyle = 'rgba(11,12,15,.6)';
        c.fillRect(x + 2, y + 2, w - 4, h - 4);
        c.strokeStyle = '#2a2f38'; c.lineWidth = 1;
        c.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
        continue;
      }
      if (label && label.mystery && !revealed) {
        // Mystery Cargo: may hold a red; border and caption by tier
        const tier = MYSTERY_TIERS[label.mystery];
        c.strokeStyle = tier.color; c.lineWidth = 2;
        c.strokeRect(x + 3, y + 3, w - 6, h - 6);
        c.font = 'bold 11px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
        const text = rec.w > 1 ? tier.short : tier.tiny;
        c.lineWidth = 3; c.strokeStyle = '#000';
        c.strokeText(text, x + w / 2, y + h - 4);
        c.fillStyle = tier.color;
        c.fillText(text, x + w / 2, y + h - 4);
      } else if (revealed) {
        // intel: the game itself showed the quality
        c.fillStyle = revealed.color + '55';
        c.fillRect(x + 2, y + 2, w - 4, h - 4);
        c.strokeStyle = revealed.color; c.lineWidth = 3;
        c.strokeRect(x + 3, y + 3, w - 6, h - 6);
        c.font = 'bold 11px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
        c.fillStyle = revealed.color;
        c.fillText(qName(revealed), x + w / 2, y + h - 4);
      } else {
        c.strokeStyle = '#3a414d'; c.lineWidth = 1;
        c.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
      }
      c.fillStyle = '#8b93a1'; c.font = '12px system-ui, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
      c.fillText('?', x + 6, y + 5);
      if (rec.price) {
        // tooltip price and the red chance by it (before any sound)
        const odds = cargoRedOdds(rec);
        c.font = 'bold 11px system-ui, sans-serif'; c.textAlign = 'right';
        c.lineWidth = 3; c.strokeStyle = '#000';
        const text = money(rec.price) + (odds && odds.red > 0 ? ` · ${pct(odds.red)}` : '');
        c.strokeText(text, x + w - 5, y + 5);
        c.fillStyle = odds && odds.red > 0 ? redColor(odds.red) : '#e6e8eb';
        c.fillText(text, x + w - 5, y + 5);
      }
      continue;
    }
    const size = `${rec.w}x${rec.h}`;
    const info = cargoInfo(rec);
    const red = qualityOdds(sound, size, info).red || 0;
    // As in the game: the cell shows possible items with a picture, quality bar and chance; reds first.
    // If there is one item (or nearly certain), one big picture.
    const cands = itemOdds(sound, size, info).filter(x => x.p >= 0.02);
    const top = cands.slice().sort((a, b) => b.p - a.p)[0];
    c.fillStyle = red > 0 ? 'rgba(127,29,29,.55)' : '#15181d';
    c.fillRect(x + 2, y + 2, w - 4, h - 4);
    if (top && (cands.length === 1 || top.p >= 0.995)) {
      drawItemIcon(c, top.it, x + 6, y + 4, w - 12, h - 16);
      c.fillStyle = qById[top.it.q].color;
      c.fillRect(x + w * 0.2, y + h - 10, w * 0.6, 3);
    } else {
      const s = Math.max(18, Math.min(MAP_U * 0.5, (w - 8) / 2));
      const cols = Math.max(1, Math.floor((w - 6) / (s + 4))), rows = Math.max(1, Math.floor((h - 6) / (s + 14)));
      const cw = (w - 6) / cols, ch = (h - 6) / rows;
      cands.slice(0, cols * rows).forEach(({ it, p }, i) => {
        const cx = x + 3 + (i % cols) * cw, cy = y + 3 + Math.floor(i / cols) * ch;
        drawItemIcon(c, it, cx + (cw - s) / 2, cy + 1, s, s);
        c.fillStyle = qById[it.q].color;
        c.fillRect(cx + cw * 0.2, cy + s + 2, cw * 0.6, 2);
        c.font = 'bold 9px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
        c.fillStyle = '#e6e8eb';
        c.fillText(pctFine(p), cx + cw / 2, cy + s + 4);
      });
    }
    const color = red > 0 ? '#ef4444' : '#3a414d';
    c.strokeStyle = key === lastKey ? '#f0b429' : color; c.lineWidth = key === lastKey || red > 0 ? 3 : 1;
    c.strokeRect(x + 3, y + 3, w - 6, h - 6);
  }

  // the best buys: a #1…#N badge in the bottom-left corner of the cargo and the ranked list under the map
  const best = bestBuys();
  best.forEach(({ rec }, i) => {
    const x = (rec.C - minC) * MAP_U, y = (rec.R - minR) * MAP_U + rec.h * MAP_U;
    c.fillStyle = '#f0b429';
    c.beginPath(); c.arc(x + 14, y - 14, 10, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#111'; c.font = 'bold 11px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('#' + (i + 1), x + 14, y - 13);
  });
  renderBestBuys(best);

  // the part of the list on screen now: a dashed frame over those rows
  if (viewport && P && performance.now() - gridSeenAt < MERCHANT_FRESH_MS) {
    const r0 = (viewport.y + offset) / P - minR, r1 = (viewport.y + viewport.h + offset) / P - minR;
    const c0 = (viewport.x - phaseX) / P - minC, c1 = (viewport.x + viewport.w - phaseX) / P - minC;
    c.save();
    c.setLineDash([6, 4]); c.strokeStyle = 'rgba(230,232,235,.55)'; c.lineWidth = 1.5;
    c.strokeRect(c0 * MAP_U + 1, r0 * MAP_U + 1, (c1 - c0) * MAP_U - 2, (r1 - r0) * MAP_U - 2);
    c.restore();
  }
  // the cargo under the mouse and the cursor itself (with the local server)
  const cur = cursorHist[cursorHist.length - 1];
  if (cursorKey && cargo.has(cursorKey)) {
    const r = cargo.get(cursorKey);
    c.strokeStyle = '#22d3ee'; c.lineWidth = 3;
    c.strokeRect((r.C - minC) * MAP_U + 1.5, (r.R - minR) * MAP_U + 1.5, r.w * MAP_U - 3, r.h * MAP_U - 3);
  }
  if (cur && P && viewport && performance.now() - cur.t < CURSOR_KEEP_MS) {
    const mx = ((cur.x - phaseX) / P - minC) * MAP_U, my = ((cur.y + offset) / P - minR) * MAP_U;
    if (mx >= 0 && my >= 0 && mx <= W && my <= H) {
      c.fillStyle = '#22d3ee';
      c.beginPath(); c.arc(mx, my, 4, 0, Math.PI * 2); c.fill();
    }
  }
}

// Item picture fitted into a rectangle keeping the proportions
function drawItemIcon(c, it, x, y, w, h) {
  const img = it.img && cachedImage(it.img);
  if (!img || !img.complete || !img.naturalWidth) return;
  const k = Math.min(w / img.naturalWidth, h / img.naturalHeight);
  const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
  c.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}

// Popup over the map: what is known about the cargo under the mouse
function showMapPop(e) {
  const key = mapCargoAt(e);
  const rec = key && cargo.get(key);
  const pop = $('mapPop');
  if (!rec) { pop.hidden = true; return; }
  const r = results.get(key);
  const sound = r && soundById(r.soundId);
  let body;
  if (sound) {
    const info = cargoInfo(rec), size = `${rec.w}x${rec.h}`;
    const red = qualityOdds(sound, size, info).red || 0;
    const list = itemOdds(sound, size, info);
    body = chanceRow(red) + (rec.price ? paybackRow(payback(list, rec.price)) : '') + itemTiles(list, 9);
  } else {
    const odds = cargoRedOdds(rec);
    body = odds ? chanceRow(odds.red) + (rec.price ? paybackRow(payback(odds.items, rec.price)) : '') + itemTiles(odds.items, 9)
      : `<div class="muted" style="margin-top:8px">${esc(tr('pop.unknown'))}</div>`;
  }
  pop.innerHTML = `<div class="head">${esc(cargoHead(rec))}</div>${body}`;
  pop.hidden = false;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - pw - 8, e.clientX - pw - 16)) + 'px';
  pop.style.top = Math.max(8, Math.min(window.innerHeight - ph - 8, e.clientY - ph / 3)) + 'px';
}

const imgCache = new Map();
function cachedImage(src) {
  let img = imgCache.get(src);
  if (!img) { img = new Image(); img.onload = drawMap; img.src = src; imgCache.set(src, img); }
  return img;
}

function canvasPos(canvas, e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}

// ---------- Beep ----------
function beep(redChance) {
  beepCtx = beepCtx || new AudioContext();
  const pattern = redChance >= 0.5 ? [1320, 1320, 1320] : redChance > 0 ? [990, 1320] : [520];
  let t = beepCtx.currentTime;
  for (const f of pattern) {
    const o = beepCtx.createOscillator(), g = beepCtx.createGain();
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g).connect(beepCtx.destination);
    o.start(t); o.stop(t + 0.13);
    t += 0.16;
  }
  // system audio also captures our own beep, so it is ignored
  muteUntil = performance.now() + pattern.length * 160 + 300;
}

// ---------- Sound base ----------
function uid() { return Math.random().toString(36).slice(2, 10); }
function soundById(id) { return sounds.find(s => s.id === id); }
function order(q) { return QUALITIES.findIndex(x => x.id === q); }

function normalizeSounds(list) {
  return (Array.isArray(list) ? list : [])
    .filter(s => s && typeof s.name === 'string')
    .map(s => ({
      id: s.id || uid(),
      name: s.name,
      nameEn: typeof s.nameEn === 'string' ? s.nameEn : '',
      lib: !!s.lib,
      dur: +s.dur || 0,
      waves: (Array.isArray(s.waves) ? s.waves : []).filter(w => typeof w === 'string'), // own recordings
      items: (s.items || []).filter(it => it && qById[it.q]).map(it => ({
        id: +it.id || 0,
        name: String(it.name || '?'), nameEn: typeof it.nameEn === 'string' ? it.nameEn : '', q: it.q, w: Math.max(0, +it.w || 0) || (it.wp ? 0 : 1),
        size: SIZES.includes(it.size) ? it.size : '',
        price: +it.price || 0,
        contact: +it.contact || 0,
        category: typeof it.category === 'string' ? it.category : '',
        wp: it.wp && typeof it.wp === 'object' ? it.wp : null,
        wm: +it.wm || 0,
        wpm: it.wpm && typeof it.wpm === 'object' ? it.wpm : null,
        wl: it.wl && typeof it.wl === 'object' ? it.wl : null,
        wlp: it.wlp && typeof it.wlp === 'object' ? it.wlp : null,
        img: typeof it.img === 'string' && (it.img.startsWith('data:image/') || /^library\/images\/\d+\.png$/.test(it.img)) ? it.img : '',
      })),
    }));
}

function loadSounds() {
  try {
    const cur = localStorage.getItem(STORE_KEY);
    if (cur) return normalizeSounds(JSON.parse(cur));
    // old version: items are kept, the recorded samples had another format
    for (const key of OLD_STORE_KEYS) {
      const old = localStorage.getItem(key);
      if (old) return normalizeSounds(JSON.parse(old).filter(s => !s.lib));
    }
  } catch {}
  return [];
}

function loadJson(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch { return def; }
}
function saveSounds() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(sounds)); } catch (e) { log(tr('log.saveFail', { msg: e.message })); }
  renderSounds();
  drawMap();
}

function renderSounds() {

        · ${s.items.length ? esc(tr('snd.red', { p: pct(odds.red || 0) })) + (redSizes.length ? ` (${redSizes.join(', ')})` : '') : esc(tr('snd.noise'))}
        ${s.id === recordingId ? `<br><b style="color:var(--bad)">${esc(tr('snd.recording'))}</b>` : ''}</div>
      <details${s.lib ? '' : ' open'}>
        <summary class="muted">${esc(tr('snd.items', { n: s.items.length }))}</summary>
        <div class="items-list">${s.items.map((it, i) => `
          <div class="item-row">
            <span class="dot" style="background:${qById[it.q].color}"></span>
            ${it.img ? `<img src="${it.img}" alt="">` : ''}
            <span class="grow" title="${esc(itemName(it))}">${esc(itemName(it))}</span>
            <span class="muted">${normSize(it.size)}${it.wp ? '' : ` ×${it.w}`}</span>
            <button class="small" data-act="img" data-i="${i}" title="${esc(tr('tip.img'))}">🖼</button>

          </div>`).join('')}</div>
        <div class="add-item">
          <input type="text" placeholder="${esc(tr('ph.item'))}" data-f="name">
          <select data-f="q">${qOptions}</select>
          <select data-f="size">${sizeOptions}</select>
          <input type="number" value="1" min="0.1" step="0.1" title="${esc(tr('tip.weight'))}" data-f="w">

      } else if (act === 'delItem') {
        s.items.splice(+e.target.dataset.i, 1); saveSounds();
      } else if (act === 'img') {
        imgTarget = { sound: s, index: +e.target.dataset.i };
        ui.imgFile.click();
      } else if (act === 'addItem') {
        addItem(el, s);
      }
    });
    el.querySelector('[data-f=name]').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(el, s); });
    ui.sounds.appendChild(el);
  }
}

function addItem(el, s) {
  const name = el.querySelector('[data-f=name]').value.trim();
  if (!name) return;
  const q = el.querySelector('[data-f=q]').value;
  const w = Math.max(0.1, +el.querySelector('[data-f=w]').value || 1);
  const size = el.querySelector('[data-f=size]').value;
  s.items.push({ name, q, w, size, price: 0, wp: null, img: '' });
  saveSounds();
}

// Shrinks a picture to 96×96 so the base does not bloat
async function resizeImage(file) {
  const bmp = await createImageBitmap(file);
  const size = 96, k = Math.min(size / bmp.width, size / bmp.height, 1);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/webp', 0.85);
}

function setRecording(id) {
  recordingId = id;
  renderSounds();
}

// ---------- Sound level ----------
// Every 10 ms a volume bar; a mark on top means a sound started here
function drawLevel(db, trig) {
  const { width: w, height: h } = ui.spec;
  specCtx.drawImage(ui.spec, -1, 0);
  specCtx.fillStyle = '#0b0c0f';
  specCtx.fillRect(w - 1, 0, 1, h);
  const v = Math.min(1, Math.max(0, (db + 90) / 80));
  specCtx.fillStyle = `hsl(${200 - v * 160}, 80%, 55%)`;
  specCtx.fillRect(w - 1, h - v * h, 1, v * h);
  if (trig) { specCtx.fillStyle = recordingId ? '#ef4444' : '#f0b429'; specCtx.fillRect(w - 1, 0, 1, 8); }
}

// ---------- Library ----------
async function importLibrary(files) {
  const ctx = new OfflineAudioContext(1, 1, Ear.SAMPLE_RATE);
  setStatus(tr('status.importing'));
  try {
    const lib = await Library.load(files, ctx, (i, n) => setStatus(tr('status.importingN', { i, n })));
    // templates go to memory, only the description goes to the sound list (and storage)
    for (const s of lib.sounds) { tplCache.set(s.id, { up: s.up, down: s.down }); delete s.up; delete s.down; }
    sounds = sounds.filter(s => !s.lib).concat(normalizeSounds(lib.sounds));
    libPools = lib.pools;
    itemQ = lib.itemQ;
    itemById = new Map();
    for (const s of sounds) for (const it of s.items) if (it.id) itemById.set(it.id, it);
    dropMismatchedSounds();
    syncBase(); // now the catalog is known: write the own purchases file for the next launch
    profiles = lib.profiles;
    try { localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); } catch {}
    renderProfiles();
    saveSounds();
    log(tr('log.libDone', { s: lib.sounds.length, i: lib.sounds.reduce((a, s) => a + s.items.length, 0) }));
    setStatus(tr(stream ? 'status.listening' : 'status.libDone'));
    return true;
  } catch (e) {
    log(tr('log.libFail', { msg: e.message }));
    setStatus(tr('status.importFail'));
    return false;
  }
}

// The library sits next to the app in the library folder: it is loaded on every start (templates live only
// in memory). Works via start.bat (localhost); with file:// the browser does not allow reading files, then the button is used.
async function autoLoadLibrary() {
  try {
    const res = await fetch('library/groups.json', { cache: 'no-cache' });
    if (!res.ok) return;
    const groupsBlob = await res.blob();
    const groups = JSON.parse(await groupsBlob.text());
    const paths = ['library/merchant.json', 'library/names_ru.json',
      ...groups.groups.flatMap(g => g.sounds.map(s => 'library/' + s.file))];
    const files = [{ path: 'library/groups.json', blob: groupsBlob }];
    await Promise.all(paths.map(async p => {
      const r = await fetch(p);
      if (r.ok) files.push({ path: p, blob: await r.blob() });
    }));
    await importLibrary(files);
  } catch {}
}

function renderProfiles() {
  ui.profile.innerHTML = `<option value="">${esc(tr('opt.allMaps'))}</option>` +
    profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  ui.profile.value = profiles.some(p => String(p.id) === String(profile)) ? String(profile) : '';
  ui.profile.hidden = !profiles.length;
}

// ---------- Utilities ----------
function pct(x) { return Math.round(x * 100) + '%'; }
// small chances with a decimal, as in the game: 7.4%, 66%
function pctFine(x) { const v = x * 100; return (v < 10 && v > 0 ? v.toFixed(1) : Math.round(v)) + '%'; }
function fmtPrice(x) { return x.toLocaleString(I18n.locale); }
// Names in the current language: English from the game data, Ukrainian and Russian use the Russian names
// (the data has no Ukrainian item translations)
function itemName(it) { return I18n.lang === 'en' && it.nameEn ? it.nameEn : it.name; }
function soundName(s) { return I18n.lang === 'en' && s.nameEn ? s.nameEn : s.name; }
function qName(q) { return tr('q.' + q.id); }
function money(x) { return x >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : Math.round(x / 1000) + 'k'; }
function redColor(red) { return red >= 0.5 ? '#ef4444' : red > 0 ? '#f0b429' : '#8b93a1'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function setStatus(s) { ui.status.textContent = s; }
function log(s) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString('uk-UA') + '  ' + s;
  ui.log.prepend(d);
  while (ui.log.children.length > 100) ui.log.lastChild.remove();
}

// ---------- Events ----------
ui.start.onclick = start;
ui.stop.onclick = stop;
ui.rescan.onclick = rescan;
ui.done.onclick = () => freeze(tr('log.manualFreeze', { n: placedCargo().length }));

$('btnLib').onclick = () => ui.libDir.click();
ui.libDir.onchange = e => {
  const files = [...e.target.files].map(f => ({ path: f.webkitRelativePath || f.name, blob: f }));
  e.target.value = '';
  if (files.length) importLibrary(files);
};
$('blue').checked = includeBlue;
$('blue').onchange = e => {
  includeBlue = e.target.checked;
  try { localStorage.setItem(BLUE_KEY, JSON.stringify(includeBlue)); } catch {}
  renderSounds();
  drawMap();
};
ui.profile.onchange = () => {
  profile = ui.profile.value;
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch {}
  renderSounds();
  drawMap();
};

function addSound() {
  const name = ui.newName.value.trim();
  if (!name) { ui.newName.focus(); return; }
  sounds.unshift({ id: uid(), name, waves: [], items: [] });
  ui.newName.value = '';
  saveSounds();
}
$('btnAdd').onclick = addSound;
ui.newName.addEventListener('keydown', e => { if (e.key === 'Enter') addSound(); });

ui.imgFile.onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f || !imgTarget) return;
  try {
    imgTarget.sound.items[imgTarget.index].img = await resizeImage(f);
    saveSounds();
  } catch (err) { log(tr('log.imgFail', { msg: err.message })); }
  imgTarget = null;
};


// Manual assignment: a click puts the last sound on a cargo, a right click clears it
function mapCargoAt(e) {
  const { minC, minR } = mapBounds();
  const p = canvasPos(ui.map, e);
  const C = minC + Math.floor(p.x * ui.map.width / MAP_U), R = minR + Math.floor(p.y * ui.map.height / MAP_U);
  const hit = placedCargo().find(([, r]) => C >= r.C && C < r.C + r.w && R >= r.R && R < r.R + r.h);
  return hit ? hit[0] : null;
}
ui.map.addEventListener('click', e => {
  const key = mapCargoAt(e);
  if (!key || !lastResult) return;
  if (lastKey && results.get(lastKey) === lastResult) results.delete(lastKey);
  results.set(key, lastResult);
  lastKey = key;
  drawMap();
});
ui.map.addEventListener('mousemove', showMapPop);
ui.map.addEventListener('mouseleave', () => { $('mapPop').hidden = true; });
ui.map.addEventListener('contextmenu', e => {
  e.preventDefault();
  const key = mapCargoAt(e);
  if (!key) return;
  results.delete(key);
  if (key === lastKey) lastKey = null;
  drawMap();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') drawMap(); });

$('btnExport').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 2, sounds })], { type: 'application/json' }));
  a.download = 'abi-ear-sounds.json';
  a.click();
};
$('btnImport').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = normalizeSounds(data.sounds || data);
    const ids = new Set(sounds.map(s => s.id));
    for (const s of incoming) { if (ids.has(s.id)) s.id = uid(); sounds.push(s); }
    saveSounds();
    log(tr('log.imported', { n: incoming.length }));
  } catch (err) { log(tr('log.importFail', { msg: err.message })); }
  e.target.value = '';
};
$('btnClear').onclick = () => {
  if (confirm(tr('confirm.clear'))) { sounds = []; results = new Map(); saveSounds(); }
};
const syncLabels = () => { ui.sensVal.textContent = ui.sens.value + ' ' + tr('unit.db'); ui.thrVal.textContent = ui.thr.value + '%'; };
ui.sens.oninput = ui.thr.oninput = syncLabels;

// Display mode. With one monitor the result card and the map go into an always-on-top window over the
// game (Document Picture-in-Picture, Chrome/Edge). The elements are moved there, not copied, so they keep
// updating; when the window closes they come back. It belongs on the left half of the screen: only the
// right half (the merchant) is captured, so the overlay never gets in the way of recognition.
async function openOverlay() {
  if (overlayWin) return;
  if (!('documentPictureInPicture' in window)) { log(tr('log.noPip')); return; }
  let w;
  try { w = await documentPictureInPicture.requestWindow({ width: 380, height: 600 }); }
  catch { log(tr('log.noPip')); return; }
  overlayWin = w;
  for (const ss of document.styleSheets) {
    try {
      const st = w.document.createElement('style');
      st.textContent = [...ss.cssRules].map(r => r.cssText).join('\n');
      w.document.head.append(st);
    } catch {}
  }
  w.document.title = tr('app');
  const box = w.document.createElement('div');
  box.className = 'overlay';
  w.document.body.append(box);
  overlayParts = [ui.result, $('mapWrap')].map(el => {
    const ph = document.createComment('overlay');
    el.replaceWith(ph);
    box.append(el);
    return { el, ph };
  });
  w.addEventListener('pagehide', () => {
    for (const { el, ph } of overlayParts) ph.replaceWith(el);
    overlayParts = [];
    overlayWin = null;
    updateModeUi();
  });
  log(tr('log.overlay'));
  updateModeUi();
}

function updateModeUi() {
  $('btnOverlay').hidden = mode !== 'overlay' || !!overlayWin;
  $('overlayNote').hidden = !overlayWin;
}

const modeSelect = $('mode');
modeSelect.value = mode;
modeSelect.onchange = () => {
  mode = modeSelect.value;
  try { localStorage.setItem(MODE_KEY, JSON.stringify(mode)); } catch {}
  if (mode !== 'overlay' && overlayWin) overlayWin.close();
  if (mode === 'overlay' && stream) openOverlay(); // the change itself is a click, so the window may open
  updateModeUi();
};
$('btnOverlay').onclick = openOverlay;

// Payback settings: purchases per raid (the best-buys count) and the item value basis
const buysSelect = $('buysPerRaid'), valueSelect = $('valueBasis');
buysSelect.value = String(buysPerRaid);
valueSelect.value = valueBasis;
buysSelect.onchange = () => { buysPerRaid = +buysSelect.value || 2; try { localStorage.setItem(BUYS_KEY, JSON.stringify(buysPerRaid)); } catch {} drawMap(); };
valueSelect.onchange = () => { valueBasis = valueSelect.value; try { localStorage.setItem(VALUE_KEY, JSON.stringify(valueBasis)); } catch {} drawMap(); };
updateModeUi();

// UI language: on change, everything with text is redrawn
const langSelect = $('lang');
langSelect.value = I18n.lang;
langSelect.onchange = () => {
  I18n.setLang(langSelect.value);
  if (stream) showGameStatus(gameStatus);
  syncLabels(); renderProfiles(); renderSounds(); updateStage(); drawMap(); renderUpdate();
};

// A new release on GitHub: the files are replaced by update.ps1 when start.bat runs, here only a hint
const REPO = 'neverh8me/abi-merchant-helper';
let latestRelease = null;
async function checkUpdate() {
  try {
    const local = (await (await fetch('version.json', { cache: 'no-cache' })).json()).version;
    const rel = await (await fetch(`https://api.github.com/repos/${REPO}/releases/latest`)).json();
    const v = String(rel.tag_name || '').replace(/^v/, '');
    const num = s => s.split('.').map(Number);
    const newer = (a, b) => { const x = num(a), y = num(b); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
    if (v && newer(v, local)) { latestRelease = { v, url: rel.html_url }; renderUpdate(); }
  } catch {} // offline or the site is not opened via start.bat: stay quiet
}
function renderUpdate() {
  const a = $('update');
  if (!latestRelease) return;
  a.textContent = tr('update.available', { v: latestRelease.v });
  a.href = latestRelease.url;
  a.hidden = false;
}
checkUpdate();
setInterval(checkUpdate, 6 * 3600e3);
I18n.apply();
syncLabels();
renderProfiles();
renderSounds();
try { OLD_PURCHASE_KEYS.forEach(k => localStorage.removeItem(k)); } catch {}
loadBase();
autoLoadLibrary();
updateStage();
drawMap();
try { localStorage.removeItem(OLD_REGION_KEY); } catch {}
</script>
