<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.ico">
<title>ABI: Merchant Helper</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d23; --line: #2a2f38; --text: #e6e8eb; --muted: #8b93a1;
    --accent: #f0b429; --ok: #3ecf8e; --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header .status { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 0 20px 16px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  /* top: result on the left (stays in place when scrolling), map on the right in its own box */
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 0; align-items: start; }
  .top .result-col { position: sticky; top: 8px; }
  .map-wrap { max-height: calc(100vh - 150px); overflow: auto; }
  @media (max-width: 960px) { .top { grid-template-columns: 1fr; } .top .result-col { position: static; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  section h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  button { background: #2a2f38; color: var(--text); border: 1px solid #3a414d; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #343a45; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  select, input[type=text], input[type=number] { background: #111317; color: var(--text); border: 1px solid #3a414d; border-radius: 6px; padding: 6px 8px; font: inherit; min-width: 0; }
  label { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  canvas { width: 100%; display: block; background: #0b0c0f; border-radius: 6px; }
  #screen { cursor: crosshair; }
  #map { cursor: pointer; width: auto; max-width: 100%; margin: 0 auto; }
  .muted { color: var(--muted); }
  .help li { margin-bottom: 6px; }
  input[type=range] { width: 140px; }
  #log { max-height: 180px; overflow: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Steps */
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .step { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--muted); font-size: 13px; }
  .step b { display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; background: #2a2f38; margin-right: 6px; }
  .step.active { border-color: var(--accent); color: var(--text); }
  .step.active b { background: var(--accent); color: #111; }
  .step.done b { background: var(--ok); color: #111; }
  .stage { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 8px; background: #f0b4290f; margin-bottom: 12px; }
  .stage .title { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stage .grow { flex: 1; }

  /* Result */
  #result { border-radius: 8px; padding: 16px; background: #0b0c0f; border: 1px solid var(--line); min-height: 150px; transition: border-color .15s, background .15s; }
  #result .big { font-size: 40px; font-weight: 800; line-height: 1.1; }
  .chance { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border: 1px solid; border-radius: 8px; margin: 12px 0; }
  .chance b { font-size: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tile { background: #1a1d23; border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px 6px; text-align: center; }
  .tile img { width: 72px; height: 72px; object-fit: contain; display: block; margin: 0 auto; }
  .tile .noimg { height: 72px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .tile i { display: block; height: 3px; border-radius: 2px; margin: 6px 10px; }
  .tile b { font-size: 15px; font-variant-numeric: tabular-nums; }

  .lang { margin-left: auto; }
  /* payback and the best buys */
  .payback { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; font-size: 13px; }
  .payback .verdict { font-weight: 700; padding: 1px 8px; border-radius: 10px; color: #111; }
  .buy-opts { margin: 10px 0 0; font-size: 13px; }
  #bestBuys .best { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid #ffffff0a; font-size: 13px; }
  #bestBuys .rank { flex: none; width: 26px; text-align: center; border-radius: 10px; background: var(--accent); color: #111; font-weight: 700; }
  #bestBuys h3 { margin: 10px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  /* overlay window (one monitor): the result card and the map float above the game */
  .overlay { padding: 8px; }
  .overlay #result { padding: 10px; min-height: 0; }
  .overlay #result .big { font-size: 28px; }
  .overlay .tiles { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
  .overlay .tile img { width: 48px; height: 48px; }
  .overlay .map-wrap { max-height: none; margin-top: 8px; }
  .update { margin-left: auto; padding: 6px 12px; border-radius: 8px; border: 1px solid #3b82f6; color: #93c5fd; text-decoration: none; font-size: 13px; }
  .update:hover { background: rgba(59, 130, 246, .15); }
  .update:not([hidden]) + .lang { margin-left: 0; }
  .credits { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 20px 20px; }
  .map-pop { position: fixed; z-index: 10; width: 340px; background: #15181d; border: 1px solid #3a414d; border-radius: 10px; padding: 12px; box-shadow: 0 8px 30px #000a; pointer-events: none; }
  .map-pop .head { color: var(--muted); font-size: 13px; }
  .map-pop .tiles { grid-template-columns: repeat(3, 1fr); }
  .map-pop .tile img { width: 56px; height: 56px; }
  #result .sub { color: var(--muted); margin: 4px 0 12px; }
  .bars div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bars .bar { flex: 1; height: 10px; background: #1a1d23; border-radius: 5px; overflow: hidden; }
  .bars .bar i { display: block; height: 100%; }
  .bars .name { width: 100px; }
  .bars .val { width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  .items { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 12px; background: #1a1d23; border: 1px solid var(--line); font-size: 13px; }
  .chip img { width: 28px; height: 28px; object-fit: contain; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  /* Sounds */
  .sound { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .sound.recording { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
  .sound.hit { border-color: var(--accent); }
  .sound-head { display: flex; align-items: center; gap: 8px; }
  .sound-head .grow { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sound .meta { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .item-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 13px; }
  .item-row .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row img { width: 24px; height: 24px; object-fit: contain; background: #0b0c0f; border-radius: 4px; }
  .add-item { display: grid; grid-template-columns: 1fr 96px 74px 50px auto; gap: 6px; margin-top: 8px; }
  details summary { cursor: pointer; font-size: 12px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .size { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .size.on { background: #ffffff14; outline: 2px solid var(--text); }
  .odds { margin-top: 12px; }
  .odds-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; border-bottom: 1px solid #ffffff0a; }
  .odds-row .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .odds-row img { width: 24px; height: 24px; object-fit: contain; }
  .odds-row b { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="app">ABI: Merchant Helper</h1>
  <button id="btnStart" class="primary" data-i18n="btn.start">Start catching</button>
  <button id="btnStop" disabled data-i18n="btn.stop">Stop</button>
  <span class="status" id="status" data-i18n="status.idle">Not running</span>
  <select id="mode" class="mode" data-i18n-title="mode.title">
    <option value="second" data-i18n="mode.second">Second screen</option><option value="overlay" data-i18n="mode.overlay">Overlay (one monitor)</option>
  </select>
  <button id="btnOverlay" hidden data-i18n="btn.overlay">Open overlay</button>
  <a id="update" class="update" target="_blank" rel="noopener" hidden></a>
  <select id="lang" class="lang" title="Мова · Language · Язык">
    <option value="uk">UA</option><option value="en">ENG</option><option value="ru">RU</option>
  </select>
</header>

<div class="top">
  <section class="result-col">
    <h2 data-i18n="h.result">Result</h2>
    <p id="overlayNote" class="muted" hidden data-i18n="overlay.here"></p>
    <div id="result"><span class="muted" data-i18n="result.wait">Waiting for a sound…</span></div>
  </section>

  <section class="map-col">
    <div class="stage">
      <span class="title" id="stageTitle"></span>
      <span class="grow muted" id="stageHint"></span>
      <button id="btnDone" class="primary" hidden data-i18n="btn.done">Done</button>
      <button id="btnRescan" hidden data-i18n="btn.rescan">Scan again</button>
    </div>
    <div class="map-wrap" id="mapWrap"><canvas id="map" width="360" height="200"></canvas></div>
    <p class="muted" style="margin:8px 0 0" data-i18n="map.hint"></p>
    <div class="row buy-opts">
      <label><span data-i18n="opt.buys">Purchases per raid</span> <select id="buysPerRaid"><option>2</option><option>3</option><option>4</option></select></label>
      <label><span data-i18n="opt.value">Value by</span> <select id="valueBasis"><option value="market" data-i18n="value.market">market price</option><option value="trader" data-i18n="value.trader">trader hand-in</option></select></label>
    </div>
    <div id="bestBuys"></div>
  </section>
</div>
<div id="mapPop" class="map-pop" hidden></div>

<main>
  <div>

    <section>
      <h2 data-i18n="h.level">Sound level</h2>
      <canvas id="spec" width="800" height="160"></canvas>
      <div class="row" style="margin-top:10px">
        <label><span data-i18n="lbl.sens">Sensitivity</span> <input type="range" id="sens" min="4" max="30" value="12"></label>
        <span id="sensVal" class="muted"></span>
        <label><span data-i18n="lbl.thr">Match threshold</span> <input type="range" id="thr" min="30" max="95" value="50"></label>
        <span id="thrVal" class="muted"></span>
        <label><input type="checkbox" id="beep" checked> <span data-i18n="lbl.beep">Beep</span></label>
      </div>
    </section>

    <section>
      <h2 data-i18n="h.log">Log</h2>
      <div id="log"></div>
    </section>
  </div>

  <div>
    <section>
      <h2 data-i18n="h.sounds">Sounds</h2>
      <div class="row">
        <button id="btnLib" class="primary" data-i18n="btn.lib">Import library</button>
        <select id="profile" hidden data-i18n-title="tip.profile"></select>
        <label data-i18n-title="tip.blue"><input type="checkbox" id="blue"> <span data-i18n="lbl.blue">Blue</span></label>
        <input type="file" id="libDir" webkitdirectory hidden>
      </div>
      <div class="row">
        <input type="text" id="newName" data-i18n-ph="ph.newName" style="flex:1">
        <button id="btnAdd" data-i18n="btn.add">Add</button>
      </div>
      <div id="sounds"></div>
      <div class="row" style="margin-top:12px">
        <button id="btnExport" data-i18n="btn.export">Export</button>
        <button id="btnImport" data-i18n="btn.import">Import</button>
        <button id="btnClear" class="danger" data-i18n="btn.clear">Clear all</button>
        <input type="file" id="file" accept=".json" hidden>
        <input type="file" id="imgFile" accept="image/*" hidden>
      </div>
    </section>

    <section>
      <h2 data-i18n="h.help">How to use</h2>
      <ol class="help">
        <li data-i18n-html="help.1"></li>
        <li data-i18n-html="help.2"></li>
        <li data-i18n-html="help.3"></li>
        <li data-i18n-html="help.4"></li>
        <li data-i18n-html="help.5"></li>
        <li data-i18n-html="help.6"></li>
        <li data-i18n-html="help.7"></li>
        <li data-i18n-html="help.8"></li>
      </ol>
      <p class="muted" data-i18n="help.note"></p>
    </section>
  </div>
</main>

<footer class="credits">Created by neverh8me and Claude Code</footer>

<video id="video" autoplay muted playsinline hidden></video>

<script src="i18n.js"></script>
<script src="audio.js"></script>
<script src="library.js"></script>
<script src="vision.js"></script>
<script src="lib/tesseract/tesseract.min.js"></script>
<script src="ocr.js"></script>
<script>
'use strict';

// ---------- Constants ----------
const TRACK_SX = 4, TRACK_SY = 2;  // frame downscale for scroll tracking
const RING_MS = 3000;        // how much frame history to keep
const OCC_GREY = 0.3;        // share of "grey" in a cell to count it as cargo (empty slots are black)
const PICK_MIN_DIFF = 4;     // minimal cargo change (0–255) to count it as dragged
const RED_MIN = 3;           // minimal "redness" of the trace where a cargo was dragged
const MAP_U = 56;            // map unit size
const SCAN_MS = 150;         // how often to parse the grid once the map is ready (price tooltips are noticed sooner)
const SCAN_FAST_MS = 45;     // and during the scan: every cargo must collect its votes while visible
const QUIET_MS = 1500;       // for this long after a sound the picture is "dirty" (a cargo is being dragged)
const REOPEN_MS = 5000;      // grid not seen for longer during a scan: the merchant was closed, scan again
const FREEZE_STABLE = 3;     // this many parses without new cargo, and the map is ready
const REVEAL_STREAK = 4;     // a revealed color has to hold for this many parses
const MERCHANT_FRESH_MS = 1500; // the merchant grid was seen this recently, so it is open
const NO_BAR_LIMIT = 8;      // this many parses without a scrollbar: the list is short, count without it
const THUMB_TOLERANCE = 0.12; // a thumb longer/shorter than remembered by more than this is suspicious
const THUMB_NEW_STREAK = 8;  // a new length for this many parses in a row: the list really changed
const MAP_MAX_ROWS = 80;     // the merchant never has more rows; more on the map is an error
const MIN_VOTES = 2;         // this many frames must confirm a cargo before it appears on the map
const SPLIT_SHARE = 0.35;    // smaller cargo beat a big one if each was seen at least this often relative to it
const UP_BIAS = 0.03;        // "put down" beats "pick up" only by this margin
const RECONNECT_MS = 2000;    // a dropped connection to the local server is retried this often
const SIZE_ALT_MARGIN = 0.05; // a sound this much below the best may replace it when only it has an item of the cargo size
const TAP_BLOCK = 512;       // how many audio samples to pass from the audio stream at once

const QUALITIES = [
  // names: qName() in the current language
  { id: 'red', color: '#ef4444' },
  { id: 'gold', color: '#f0b429' },
  { id: 'purple', color: '#a855f7' },
  { id: 'blue', color: '#3b82f6' },
  { id: 'green', color: '#22c55e' },
  { id: 'white', color: '#d1d5db' },
];
const qById = Object.fromEntries(QUALITIES.map(q => [q.id, q]));
const SIZES = ['1x1', '1x2', '2x1', '2x2', '2x3', '3x2'];
const SIZE_KEYS = ['1x1', '1x2', '2x2', '1x3', '2x3', '3x3']; // sizes without rotation, for display
const MYSTERY_TIERS = {
  rare: { short: 'Rare', tiny: 'Rare', name: 'Rare Mystery Cargo', color: '#a855f7' },
  uncommon: { short: 'Uncommon', tiny: 'Unc', name: 'Uncommon Mystery Cargo', color: '#3b82f6' },
  common: { short: 'Mystery', tiny: 'Myst', name: 'Mystery Cargo', color: '#d1d5db' },
};
const LABEL_TRIES = 4;       // attempts to read a cargo label
const PRICE_MARKUP = 1.1;    // the merchant adds ~10% to the pool price (100,000 in the table — 110,000 in the game)
const PRICE_MATCH_LOG = 0.25; // the tooltip price must be close to the pool price (in log scale, ≈ ±28%)
const HOVER_DIFF = 12;       // a cargo changed more than this: the price tooltip covered it
const HOVER_KEEP_MS = 6000;  // for this long after hovering, a "pick up" sound belongs to the hovered cargo
const CURSOR_KEEP_MS = 5000; // cursor history kept, for the cargo under the mouse at a sound
const CURSOR_CARD_QUIET_MS = 4000; // a sound result stays this long before hovering shows another card
const HOVER_MAX_CARGO = 16;  // a tooltip covers at most this many cargo; more is not a tooltip
const TIP_W = 3.2, TIP_H = 1.8; // price tooltip size in cells (with a margin)
const BASE_UPDATE_MAX = 6;   // the appearance reference is updated only on small changes (not on a tooltip)
const STORE_KEY = 'abi-ear-sounds-v4';       // v4: own recordings are raw sound, not a fingerprint
const OLD_STORE_KEYS = ['abi-ear-sounds-v3', 'abi-ear-sounds-v2'];
const OLD_REGION_KEY = 'abi-ear-region-v1'; // manual frame from old versions, no longer needed
const MERCHANT_SIDE = 0.5;   // the merchant grid is searched to the right of this share of the game window width
const REDETECT_AFTER = 8;    // once per this many frames (until the map is ready) the cell size is re-checked
const REDETECT_MAX_CARGO = 6; // this many cargo found: the cell size is certainly right
const PROFILES_KEY = 'abi-ear-profiles-v1';
const PROFILE_KEY = 'abi-ear-profile-v1';
const BLUE_KEY = 'abi-ear-blue-v1';
const MODE_KEY = 'abi-kaluvan-mode-v1'; // display mode: 'second' (second screen) or 'overlay' (one monitor)
const BUYS_KEY = 'abi-kaluvan-buys-v1';  // purchases allowed per raid (2, or up to 4 with a levelled character)
const VALUE_KEY = 'abi-kaluvan-value-v1'; // item value basis for payback: 'market' or 'trader'
const PAY_GOOD = 1.15, PAY_GAMBLE = 0.9; // expected value vs price: worth it from 115%, a gamble from 90%
const PURCHASES_KEY = 'abi-kaluvan-purchases-v2'; // v1 had records from the nickname bug, not used
const OLD_PURCHASE_KEYS = ['abi-kaluvan-purchases-v1', 'abi-kaluvan-nick-v1'];
const PRIOR_N = 20;          // the merchant data weighs as much as this many own purchases (more: learns slower)
const FEED_MS = 1000;        // how often to look at the "… obtained [item]" line above the grid
const FEED_TOP = 1.15, FEED_BOTTOM = 0.6; // where it is: a band above the top of the list, in cells
const BUY_MATCH = 0.01;      // the line amount and the tooltip price match with this precision
const BALANCE_LEFT = 0.4;    // the "Owned" balance is right of this share of the list width
const BALANCE_BELOW = 2.6;   // and no lower than this many cells below the list
const FEED_WAIT_MS = 30000;  // a feed line waits this long for the balance to confirm it
const FEED_SAME_MS = 60000;  // the same line (price and similar name) within this window is the same purchase
const BASE_URL = 'library/purchases.json'; // shared base in the app folder
const BASE_REMOTE = 'https://raw.githubusercontent.com/neverh8me/abi-merchant-helper/main/library/purchases.json'; // and the freshest one on GitHub

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const ui = {
  start: $('btnStart'), stop: $('btnStop'), status: $('status'), result: $('result'),
  spec: $('spec'), video: $('video'), log: $('log'), sounds: $('sounds'), newName: $('newName'),
  sens: $('sens'), sensVal: $('sensVal'), thr: $('thr'), thrVal: $('thrVal'), beep: $('beep'),
  map: $('map'), imgFile: $('imgFile'), profile: $('profile'), libDir: $('libDir'),
  stageTitle: $('stageTitle'), stageHint: $('stageHint'), rescan: $('btnRescan'), done: $('btnDone'),
};
const specCtx = ui.spec.getContext('2d');
const mapCtx = ui.map.getContext('2d');

// ---------- State ----------
let stream = null, audioCtx = null, workletNode = null, srcNode = null, beepCtx = null;
let detector = null;
let gameWs = null, gameStatus = null; // game-only sound from the local server
let screenWs = null;         // screen frames from the local server
const tplCache = new Map();  // sound id → { up: [template], down: [template] }
let captureOnset = -Infinity; // when the sound started (performance.now)
let recordingId = null;      // id of the sound a sample is being recorded for
let lastHitId = null;
let muteUntil = 0;
let sounds = loadSounds();
let profiles = loadJson(PROFILES_KEY, []);   // maps from the library: [{ id, name }]
let profile = loadJson(PROFILE_KEY, '');     // selected map ('' — average over all)
let includeBlue = loadJson(BLUE_KEY, false); // whether to count blue items
let mode = loadJson(MODE_KEY, 'second');     // display mode, see MODE_KEY
let buysPerRaid = loadJson(BUYS_KEY, 2);     // see BUYS_KEY
let valueBasis = loadJson(VALUE_KEY, 'market'); // see VALUE_KEY
let overlayWin = null, overlayParts = [];    // the overlay window and the elements moved into it
let purchases = loadJson(PURCHASES_KEY, []); // own purchases: [{ t, soundId, size, label, price, itemId, item, q }]
let basePurchases = [];      // shared base shipped with the app (library/purchases.json) and refreshed from GitHub
let balance = null, spent = 0;               // Koen balance below the grid and how much it dropped (not yet explained by purchases)
let balanceSig = null, feedQueue = [], feedDone = []; // feed lines: waiting for balance confirmation / already counted
let feedBusy = false, feedAt = 0, feedSig = null; // reading of the feed line and the balance
let libPools = [], itemQ = {}, itemById = new Map(); // merchant pools and items from the library
let hover = null;            // the cargo just hovered: { key, t }
let cursorHist = [];         // the mouse cursor from the local server, in frame px: [{ x, y, t }] for the last seconds
let cursorKey = null;        // the cargo under the cursor now
let hoverBusy = false, hoverSig = ''; // price tooltip reading: busy / which cargo it covers

// Merchant grid. "Region" coordinates are frame pixels relative to the region's top-left corner.
// Absolute row R has its top line at y = R*P - offset (offset grows when scrolling down).
let P = 0;                   // grid cell size, frame px
let checkFrames = 0;         // frames since the last cell size check
let phaseX = 0;              // line shift along x (0..P)
let offset = 0;              // scroll
let viewport = null;         // visible part of the grid { x, y, w, h } in region px
let prevSig = null;          // row signatures of the previous small frame
let ring = [];               // [{ t, small, red, offset }]
let cargo = new Map();       // key "C,R,w,h" → { C, R, w, h, votes, base, baseRed, thumb }
let results = new Map();     // cargo key → { soundId, score }
let lastKey = null;          // the cargo a sound was just assigned to
let lastResult = null;
let lastSeen = null;         // the latest recognition for the preview: { grid, items }
let gridSeenAt = 0;          // when the merchant grid was last seen
let listTopR = null;         // absolute row of the first list row (the top at first detection)
let phase = 'scan';          // 'scan' — building the map, 'frozen' — the map is ready and does not change
let frozenPlaced = null;     // the ready map: the fixed list of cargo
let sawTop = false, sawEnd = false; // whether the top and the bottom of the list were seen during the scan
let stableCount = 0;         // how many parses in a row had no new cargo
let sbKnown = null;          // the scrollbar track found { x, trackTop, trackLen }
let noBarCount = 0;          // how many parses the grid is visible but the scrollbar is not
let lastSbTop = true;        // the scrollbar thumb was at the very top on the latest frame
let thumbOddLen = 0, thumbOddCount = 0; // a thumb of a different length: which and for how many frames in a row
let videoReader = null, videoTimer = null;
let lastScan = 0;
let imgTarget = null;        // { sound, index } the item a picture is being chosen for

const fullCanvas = document.createElement('canvas');
const fullCtx = fullCanvas.getContext('2d', { willReadFrequently: true });
const smallCanvas = document.createElement('canvas');
const smallCtx = smallCanvas.getContext('2d', { willReadFrequently: true });

// ---------- Capture ----------
const WORKLET_SRC = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(${TAP_BLOCK}); this.n = 0; }
  process(inputs) {
    const inp = inputs[0];
    if (!inp || !inp.length) return true;
    const ch0 = inp[0], ch1 = inp[1] || inp[0];
    for (let i = 0; i < ch0.length; i++) {
      this.buf[this.n++] = (ch0[i] + ch1[i]) * 0.5;
      if (this.n === ${TAP_BLOCK}) { this.port.postMessage(this.buf.slice()); this.n = 0; }
    }
    return true;
  }
}
registerProcessor('tap', Tap);`;

async function start() {
  beepCtx = beepCtx || new AudioContext(); // created during the click so the browser does not block the sound
  if (typeof Ocr !== 'undefined') Ocr.start().catch(() => {}); // text readers start in advance, in the background
  if (mode === 'overlay') openOverlay(); // needs this click, so before any await
  // The local server (start.bat) provides the game-only sound and the screen capture, no browser sharing.
  // Without it: browser screen sharing and all PC sound.
  gameWs = await connectGameAudio();
  screenWs = gameWs ? await connectScreen() : null;
  if (screenWs) {
    stream = { getTracks: () => [] }; // the screen comes from the server, there is no browser stream
    startNativeScreen();
  } else {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia(gameWs
        ? { video: { frameRate: 15 }, audio: false }
        : {
          video: { frameRate: 15 },
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
          systemAudio: 'include',
        });
    } catch (e) {
      closeGameAudio();
      setStatus(tr('status.cancelled', { msg: e.message }));
      return;
    }
    if (!gameWs && !stream.getAudioTracks().length) {
      setStatus(tr('status.noAudio'));
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      return;
    }
    stream.getTracks().forEach(t => t.addEventListener('ended', stop));
    startVideo(stream.getVideoTracks()[0]);
  }

  detector = Ear.makeStream({
    sens: () => +ui.sens.value,
    muted: () => performance.now() < muteUntil,
    onWindow,
    onRaw,
    onLevel: (db, trig) => {
      if (trig) captureOnset = performance.now();
      if (document.visibilityState === 'visible') drawLevel(db, trig);
    },
  });

  if (gameWs) {
    wireGameAudio();
    showGameStatus(gameStatus);
  } else {
    // the same rate as the library, so the samples match exactly
    audioCtx = new AudioContext({ latencyHint: 'interactive', sampleRate: Ear.SAMPLE_RATE });
    const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
    await audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    srcNode = audioCtx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
    workletNode = new AudioWorkletNode(audioCtx, 'tap', { numberOfOutputs: 0 });
    workletNode.port.onmessage = e => detector.push(e.data);
    srcNode.connect(workletNode);
    setStatus(tr('status.listenAll', { rate: audioCtx.sampleRate }));
  }

  ui.start.disabled = true; ui.stop.disabled = false;
  log(tr('log.started', { audio: tr(gameWs ? 'log.audioGame' : 'log.audioAll'), screen: tr(screenWs ? 'log.screenServer' : 'log.screenBrowser') }));
  resetScan();
}

// Connects to the game sound from the local server. Returns a WebSocket or null if there is no server.
// Game sound from the local server. If the connection drops (the server restarted, the PC slept), it is
// re-opened every RECONNECT_MS while catching is on, instead of staying silent until a restart.
function wireGameAudio() {
  gameWs.onmessage = e => {
    if (typeof e.data === 'string') showGameStatus(JSON.parse(e.data));
    else if (detector) detector.push(new Float32Array(e.data));
  };
  gameWs.onclose = () => {
    if (!stream) return;
    gameWs = null;
    setStatus(tr('status.audioClosed'));
    setTimeout(reconnectAudio, RECONNECT_MS);
  };
}
async function reconnectAudio() {
  if (!stream || gameWs) return;
  const ws = await connectGameAudio();
  if (!stream) { if (ws) ws.close(); return; }
  if (!ws) { setTimeout(reconnectAudio, RECONNECT_MS); return; }
  gameWs = ws;
  wireGameAudio();
  showGameStatus(gameStatus);
  log(tr('log.reconnected'));
}
async function reconnectScreen() {
  if (!stream || screenWs) return;
  const ws = await connectScreen();
  if (!stream) { if (ws) ws.close(); return; }
  if (!ws) { setTimeout(reconnectScreen, RECONNECT_MS); return; }
  screenWs = ws;
  startNativeScreen();
}

function connectGameAudio() {
  if (!/^https?:$/.test(location.protocol)) return Promise.resolve(null);
  return new Promise(resolve => {
    let ws;
    try { ws = new WebSocket(`ws://${location.host}/audio`); } catch { resolve(null); return; }
    ws.binaryType = 'arraybuffer';
    const timer = setTimeout(() => { ws.close(); resolve(null); }, 1500);
    ws.onmessage = e => {
      if (typeof e.data !== 'string') return;
      clearTimeout(timer);
      gameStatus = JSON.parse(e.data);
      ws.onmessage = null;
      resolve(ws);
    };
    ws.onerror = () => { clearTimeout(timer); resolve(null); };
  });
}

function closeGameAudio() {
  if (!gameWs) return;
  const ws = gameWs;
  gameWs = null;
  ws.onclose = null;
  ws.close();
}

// Screen frames from the server (JPEG). Returns a WebSocket or null.
function connectScreen() {
  return new Promise(resolve => {
    let ws;
    try { ws = new WebSocket(`ws://${location.host}/screen`); } catch { resolve(null); return; }
    ws.binaryType = 'arraybuffer';
    const timer = setTimeout(() => { ws.close(); resolve(null); }, 1500);
    ws.onopen = () => { clearTimeout(timer); resolve(ws); };
    ws.onerror = () => { clearTimeout(timer); resolve(null); };
  });
}

function startNativeScreen() {
  let busy = false; // new frames are skipped while the previous one is parsed, so no delay builds up
  screenWs.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'cursor') { onCursor(m.x, m.y); return; }
      if (m.type !== 'screen') return;
      frameCropped = !!m.crop;
      if (m.black) log(tr('log.black'));
      if (m.state === 'nogame') log(tr('log.nogame'));
      else if (m.state === 'minimized') log(tr('log.minimized'));
      else if (m.state === 'game') log(tr('log.gameWin'));
      return;
    }
    if (busy) return;
    busy = true;
    createImageBitmap(new Blob([e.data], { type: 'image/jpeg' }))
      .then(bmp => { try { onVideoFrame(bmp, bmp.width, bmp.height); } finally { bmp.close(); } })
      .catch(() => {})
      .finally(() => { busy = false; });
  };
  screenWs.onclose = () => { if (stream) { screenWs = null; log(tr('log.screenClosed')); setTimeout(reconnectScreen, RECONNECT_MS); } };
}

function closeScreen() {
  if (!screenWs) return;
  const ws = screenWs;
  screenWs = null;
  ws.onclose = null;
  ws.close();
}

function showGameStatus(st) {
  gameStatus = st;
  if (!stream || !st) return;
  if (st.state === 'game') setStatus(tr('status.game'));
  else if (st.state === 'wait') setStatus(tr('status.wait'));
  else if (st.state === 'error') setStatus(tr('status.error', { msg: st.message }));
}

function stop() {
  if (!stream) return;
  stream.getTracks().forEach(t => t.stop());
  stream = null;
  closeGameAudio();
  closeScreen();
  if (audioCtx) audioCtx.close();
  audioCtx = null; workletNode = null; srcNode = null; detector = null;
  if (videoReader) videoReader.cancel().catch(() => {});
  videoReader = null;
  clearInterval(videoTimer);
  ui.video.srcObject = null;
  ui.start.disabled = false; ui.stop.disabled = true;
  setRecording(null);
  setStatus(tr('status.stopped'));
  updateStage();
}

// ---------- Recognition ----------
// Templates live only in memory: library ones are built from wav at start, own ones from recorded waves
function templatesOf(s) {
  let t = tplCache.get(s.id);
  if (!t) {
    t = { up: (s.waves || []).map(b64 => Ear.makeTemplate(Ear.decodeWave(b64))).filter(Boolean), down: [] };
    tplCache.set(s.id, t);
  }
  return t;
}

function allTemplates() {
  const out = [];
  for (const s of sounds) {
    const t = templatesOf(s);
    for (const tpl of t.up) out.push({ id: s.id, kind: 'up', tpl });
    for (const tpl of t.down) out.push({ id: s.id, kind: 'down', tpl });
  }
  return out;
}

function onWindow(win, msAgo) {
  if (recordingId) return; // recording goes through onRaw
  classify(win, performance.now() - msAgo);
}

function onRaw(wave, msAgo) {
  if (!recordingId) return;
  const s = soundById(recordingId);
  const tpl = s && Ear.makeTemplate(wave);
  if (tpl) {
    (s.waves ||= []).push(Ear.encodeWave(wave));
    templatesOf(s).up.push(tpl);
    saveSounds();
    log(tr('log.saved', { name: soundName(s), n: templatesOf(s).up.length }));
  }
  setRecording(null);
}

function classify(win, onset) {
  const tpls = allTemplates();
  if (!tpls.some(t => t.kind === 'up')) { log(tr('log.noSounds')); return; }
  const res = Ear.match(win, tpls);
  // the best "pick up" of every sound, best first
  const ranked = [], seenIds = new Set();
  for (const r of res) {
    if (r.kind !== 'up' || seenIds.has(r.id)) continue;
    seenIds.add(r.id);
    ranked.push({ s: soundById(r.id), score: r.score });
  }
  const { s: best, score } = ranked[0];
  const thr = +ui.thr.value / 100;

  // a "put down" sound (the cargo was released) is not a new cargo
  const down = res.find(r => r.kind === 'down');
  if (down && down.score >= thr && down.score > score + UP_BIAS) {
    log(tr('log.down', { name: soundName(soundById(down.id)), p: pct(down.score) }));
    return;
  }
  if (score < thr) {
    log(tr('log.unknown', { name: soundName(best), p: pct(score) }));
    return;
  }
  if (!best.items.length) {
    log(tr('log.noise', { name: soundName(best), p: pct(score) }));
    return;
  }
  // a long sound has several hits: do not recognize its tail as a new cargo
  if (best.dur) muteUntil = Math.max(muteUntil, onset + best.dur * 1000 + 150);

  lastHitId = best.id;
  renderSounds();
  lastResult = { soundId: best.id, score, t: Date.now() };
  // a cargo is searched only while the merchant is on screen: otherwise (stash, raid) the map is stale,
  // and the size of an unrelated cargo would spoil the odds
  const merchantOpen = cargo.size && performance.now() - gridSeenAt < MERCHANT_FRESH_MS;
  const hovered = hover && performance.now() - hover.t < HOVER_KEEP_MS && cargo.has(hover.key) ? hover.key : null;
  // the cargo: under the cursor when the sound started (exact, with the local server); else the one just hovered
  // (as the paid site does); else by the red trace
  const atCursor = merchantOpen ? cursorKeyAt(onset) : null;
  const key = merchantOpen ? atCursor || hovered || pickCargo(onset) : null;
  hover = null;
  const rec = key && cargo.get(key);
  const size = rec ? `${rec.w}x${rec.h}` : '';
  const label = cargoInfo(rec);
  // The cargo size rules items out: if the best sound has no item of this size, a nearly as good sound
  // that has one is taken instead (several groups sound alike)
  let sound = best, sScore = score, second = ranked[1];
  if (size) {
    const fits = s => s && s.items.some(it => normSize(it.size) === normSize(size));
    if (!fits(best)) {
      const alt = ranked.slice(1).find(r => r.score >= score - SIZE_ALT_MARGIN && r.score >= thr && fits(r.s));
      if (alt) { second = ranked[0]; sound = alt.s; sScore = alt.score; lastResult = { soundId: sound.id, score: sScore, t: lastResult.t }; }
    }
  }
  lastResult.key = key;
  showResult(sound, sScore, second, size, label);
  const red = qualityOdds(sound, size, label).red || 0;
  if (ui.beep.checked) beep(red);

  if (key) {
    results.set(key, lastResult);
    lastKey = key;
    log(tr('log.hitCargo', { name: soundName(sound), p: pct(sScore), size: normSize(size), cell: cargoName(key), red: pct(red) }));
  } else {
    lastKey = null;
    log(tr('log.hit', { name: soundName(sound), p: pct(sScore), red: pct(red) }) + (merchantOpen ? tr('log.noCargo') : ''));
  }
  drawMap();
}

// ---------- Odds ----------
// Item weight for the selected map; own items (without merchant data) have one weight for all maps.
// Blue items do not actually drop from the merchant (although the abibuilder tables have them): not counted without the checkbox.
// label — what is known about the cargo (cargoInfo): the label and, if read, the price. By price — only pools of that
// price and label; by label alone — the pools of that label (every pool carries the merchant label of its cargo).
function weightOf(it, label) {
  if (it.q === 'blue' && !includeBlue) return 0;
  if (label && label.priceW) return label.priceW.get(it.id) || 0;
  const pl = label && poolLabel(label);
  if (pl && it.wl) return it.wl[pl] ? (profile ? (it.wlp[pl] || {})[profile] || 0 : it.wl[pl]) : 0;
  if (label && label.mystery && it.wpm) return profile ? it.wpm[profile] || 0 : it.wm;
  if (profile && it.wp) return it.wp[profile] || 0;
  return it.w;
}

// The merchant label of a cargo as the pools name it ("Rare Mystery Cargo", "Rare Collectibles"…), or ''
function poolLabel(label) {
  return label ? labelName(label) || '' : '';
}

// Whether any pool with this label holds a red item (Mystery Cargo, rare category cargo…)
function labelCanRed(label) {
  const pl = poolLabel(label);
  if (!pl || !libPools.some(p => p.label)) return !label.category; // no label data: the old rule
  return libPools.some(p => p.label === pl && p.items.some(([id]) => itemQ[id] === 'red'));
}

// Size without rotation: the merchant may place a cargo rotated (TI Module 2×1 lies as 1×2),
// so we compare "smaller side × larger side"
function normSize(size) {
  if (!size) return '';
  const [a, b] = size.split('x').map(Number);
  return `${Math.min(a, b)}x${Math.max(a, b)}`;
}

// Sound items that fit the cargo size and label (cargo size at the merchant = item size).
// A known label keeps only items its pools can hold: a category cargo ("Tools"…) holds that category,
// and reds only where the pools have them (Mystery Cargo, Rare Collectibles…).
function itemsFor(sound, size, label) {
  let items = sound.items.filter(it => it.q !== 'blue' || includeBlue);
  const pl = label && poolLabel(label);
  if (pl && items.some(it => it.wl)) {
    const inLabel = items.filter(it => it.wl && it.wl[pl] > 0);
    if (inLabel.length) items = inLabel;
  } else if (label && label.category) {
    // no label data (an old library): the former rule
    items = items.filter(it => it.q !== 'red');
    const same = items.filter(it => it.category === label.category);
    if (same.length) items = same;
  }
  if (!size) return items;
  const fit = items.filter(it => normSize(it.size) === normSize(size));
  return fit.length ? fit : items; // the size matched nothing: show all
}

// Probability of each item; if none of them occurs on the map, all are equal.
// Order: reds first, then golds and so on; within a quality, by chance.
function itemOdds(sound, size, label) {
  const list = itemsFor(sound, size, label);
  let total = list.reduce((a, it) => a + weightOf(it, label), 0);
  // no sound item fits the price, so the price or the sound was read wrong: go without the price
  if (!total && label && label.priceW) return itemOdds(sound, size, { ...label, priceW: null });
  const uniform = !total;
  if (uniform) total = list.length || 1;
  // Purchases with this sound refine the odds: the merchant data counts as PRIOR_N "imaginary" purchases,
  // the real ones are added to them (Dirichlet posterior mean). The more purchases, the more they are trusted.
  const seen = boughtCounts(sound.id);
  const n = list.reduce((a, it) => a + (seen.get(it.id) || 0), 0);
  return list.map(it => {
    const prior = (uniform ? 1 : weightOf(it, label)) / total;
    return { it, p: n ? (PRIOR_N * prior + (seen.get(it.id) || 0)) / (PRIOR_N + n) : prior };
  }).sort((a, b) => order(a.it.q) - order(b.it.q) || b.p - a.p);
}

// How many times each item dropped with the sound (shared base + own): id → count
function boughtCounts(soundId) {
  const out = new Map();
  for (const b of allPurchases()) if (b.soundId === soundId && b.itemId != null) out.set(b.itemId, (out.get(b.itemId) || 0) + 1);
  return out;
}

// Shared base and own purchases together, without duplicates (an own purchase already in the base counts once)
const purchaseKey = b => `${b.t}|${b.itemId}|${b.price}`;
function mergePurchases(...lists) {
  const out = new Map();
  for (const list of lists) for (const b of list) if (b && b.t) out.set(purchaseKey(b), b);
  return [...out.values()].sort((a, b) => a.t - b.t);
}
let allCache = null;
function allPurchases() {
  return allCache || (allCache = mergePurchases(basePurchases, purchases));
}

function qualityOdds(sound, size, label) {
  const odds = {};
  for (const { it, p } of itemOdds(sound, size, label)) odds[it.q] = (odds[it.q] || 0) + p;
  return odds;
}

// The item for the picture: the most likely red one if any, otherwise the most likely item
function showcaseItem(sound, size, label) {
  const list = itemOdds(sound, size, label).filter(x => x.p > 0);
  const red = list.find(x => x.it.q === 'red');
  return (red || list.slice().sort((a, b) => b.p - a.p)[0] || {}).it;
}

function sizesOf(sound) {
  const have = new Set(itemsFor(sound, '').map(it => normSize(it.size)));
  return SIZE_KEYS.filter(sz => have.has(sz));
}

function showResult(sound, score, second, size, label) {
  const odds = qualityOdds(sound, size, label);
  const red = odds.red || 0;
  const color = redColor(red);
  ui.result.style.borderColor = color;
  ui.result.style.background = color + '1a';

  // red chance for every size: visible even if the cargo was not determined
  const sizes = sizesOf(sound).map(sz => {
    const r = qualityOdds(sound, sz, label).red || 0;
    return `<span class="size${sz === normSize(size) ? ' on' : ''}" style="border-color:${redColor(r)}">${sz} <b style="color:${redColor(r)}">${pct(r)}</b></span>`;
  }).join('');

  const alt = second && second.score > score - 0.05 && second.s.items.length
    ? `<div class="muted" style="margin-top:10px">${esc(tr('card.alt', { name: soundName(second.s), p: pct(second.score), red: pct(qualityOdds(second.s, size, label).red || 0) }))}</div>`
    : '';

  const parts = [tr('card.sub', { name: soundName(sound), p: pct(score) })];
  ui.result.innerHTML = `
    <div class="big" style="color:${color}">${red >= 0.995 ? tr('card.red') : red > 0 ? tr('card.redP', { p: pct(red) }) : tr('card.notRed')}</div>
    <div class="sub">${esc(parts[0] + (size ? tr('card.cargo', { size: normSize(size) }) : ''))}${label && (label.mystery || label.category) ? `, ${esc(labelName(label))}` : ''}${label && label.price ? `, ${fmtPrice(label.price)}` : ''}</div>
    ${sizes ? `<div class="sizes">${sizes}</div>` : ''}
    ${chanceRow(red)}
    ${label && label.price ? paybackRow(payback(itemOdds(sound, size, label), label.price)) : ''}
    ${itemTiles(itemOdds(sound, size, label))}
    ${alt}`;
  document.title = tr('doc.title', { p: pct(red), app: tr('app') });
}

// ---------- Payback ----------
// Value of an item: the market price or the trader hand-in price (selectable)
function itemValue(it) {
  return valueBasis === 'trader' ? it.contact || it.price || 0 : it.price || it.contact || 0;
}

// Whether a cargo pays off: the expected value of what drops against the price, the chance to get more than
// the price, the cheapest and the dearest likely item. list — [{ it, p }] as from itemOdds / cargoRedOdds.
function payback(list, price) {
  const known = list.filter(x => x.p > 0 && itemValue(x.it) > 0);
  const total = known.reduce((a, x) => a + x.p, 0);
  if (!price || !total) return null;
  let ev = 0, more = 0, min = Infinity, max = 0;
  for (const { it, p } of known) {
    const v = itemValue(it), q = p / total;
    ev += q * v;
    if (v > price) more += q;
    if (q >= 0.005) { min = Math.min(min, v); max = Math.max(max, v); }
  }
  const verdict = ev >= price * PAY_GOOD ? 'good' : ev >= price * PAY_GAMBLE ? 'gamble' : 'bad';
  return { ev, price, more, min: min === Infinity ? 0 : min, max, verdict };
}

const VERDICT_COLOR = { good: '#22c55e', gamble: '#f0b429', bad: '#ef4444' };
function paybackRow(pb) {
  if (!pb) return '';
  const c = VERDICT_COLOR[pb.verdict];
  const diff = Math.round((pb.ev / pb.price - 1) * 100);
  return `<div class="payback" style="border-color:${c}66;background:${c}10">
    <span class="verdict" style="background:${c}">${esc(tr('pb.' + pb.verdict))}</span>
    <span>${esc(tr('pb.ev', { ev: money(pb.ev), price: money(pb.price), diff: (diff > 0 ? '+' : '') + diff + '%' }))}</span>
    <span class="muted">${esc(tr('pb.more', { p: pct(pb.more) }))} · ${money(pb.min)}–${money(pb.max)}</span>
  </div>`;
}

// What may drop from a cargo now: by its sound if one was heard, otherwise by label and price
function cargoOdds(key, rec) {
  const r = results.get(key);
  const sound = r && soundById(r.soundId);
  if (sound) return itemOdds(sound, `${rec.w}x${rec.h}`, cargoInfo(rec));
  const o = cargoRedOdds(rec);
  return o ? o.items : [];
}

// The best buys on the map: cargo with a known price ranked by the expected profit, as many as may be bought
function bestBuys() {
  const out = [];
  for (const [key, rec] of placedCargo()) {
    if (!rec.price || rec.bought) continue;
    const pb = payback(cargoOdds(key, rec), rec.price);
    if (pb && pb.ev > pb.price) out.push({ key, rec, pb, profit: pb.ev - pb.price });
  }
  return out.sort((a, b) => b.profit - a.profit).slice(0, buysPerRaid);
}

function renderBestBuys(list) {
  const el = $('bestBuys');
  if (!list.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<h3>${esc(tr('best.title', { n: buysPerRaid }))}</h3>` + list.map((b, i) => `
    <div class="best"><span class="rank">#${i + 1}</span>
      <span>${esc(cargoHead(b.rec))} → ~${money(b.pb.ev)} <b style="color:${VERDICT_COLOR[b.pb.verdict]}">(+${money(b.profit)})</b></span>
    </div>`).join('');
}

// The "Red chance NN%" row
function chanceRow(red) {
  const c = redColor(red);
  return `<div class="chance" style="border-color:${c}66;background:${c}14"><span><span class="dot" style="background:${c}"></span> ${tr('pop.red')}</span><b style="color:${c}">${pct(red)}</b></div>`;
}

// Tiles of possible items: picture, quality bar, chance. Reds first, zero ones are not shown.
function itemTiles(list, max = 12) {
  const shown = (list.some(x => x.p > 0) ? list.filter(x => x.p >= 0.005) : list).slice(0, max);
  return `<div class="tiles">${shown.map(({ it, p }) => `
    <div class="tile" title="${esc(itemName(it))} · ${normSize(it.size)}${it.price ? ' · ~' + money(it.price) : ''}">
      ${it.img ? `<img src="${it.img}" alt="">` : `<div class="noimg">${esc(itemName(it))}</div>`}
      <i style="background:${qById[it.q].color}"></i>
      <b>${pctFine(p)}</b>
    </div>`).join('')}</div>`;
}

// ---------- Screen: grid search, scrolling, cargo ----------
function resetScan() {
  P = 0; checkFrames = 0; offset = 0; viewport = null; prevSig = null; ring = []; listTopR = null;
  cargo = new Map(); results = new Map(); lastKey = null; lastSeen = null; gridSeenAt = 0;
  phase = 'scan'; sawTop = false; sawEnd = false; stableCount = 0;
  sbKnown = null; noBarCount = 0; frozenPlaced = null;
  updateStage();
  drawMap();
}

// "Scan again" (after a purchase): the merchant list keeps its place, cell size and scrollbar, only the cargo
// moved. So the grid geometry stays and only the cargo are collected anew: drawing starts on the next frame.
// The top of the list counts as seen if the list is scrolled to the top right now.
function rescan() {
  if (!P || !viewport) { resetScan(); return; }
  cargo = new Map(); results = new Map(); lastKey = null; frozenPlaced = null; hover = null; hoverSig = '';
  phase = 'scan'; sawTop = !sbKnown || lastSbTop; sawEnd = false; stableCount = 0; checkFrames = 0;
  updateStage();
  drawMap();
}

function startVideo(track) {
  if ('MediaStreamTrackProcessor' in window) {
    // works even when the tab is in the background, unlike <video> + timers
    videoReader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    const reader = videoReader;
    (async () => {
      while (videoReader === reader) {
        const { value: frame, done } = await reader.read();
        if (done) break;
        try { onVideoFrame(frame, frame.displayWidth, frame.displayHeight); } finally { frame.close(); }
      }
    })().catch(e => log(tr('log.video', { msg: e.message })));
  } else {
    ui.video.srcObject = new MediaStream([track]);
    videoTimer = setInterval(() => {
      if (ui.video.videoWidth) onVideoFrame(ui.video, ui.video.videoWidth, ui.video.videoHeight);
    }, 66);
  }
}

// The merchant grid is searched in the right half of the game window: the merchant is always on the right, and on the
// left are the player's own pockets and backpack with the same kind of cells
let frameCropped = false; // the server already sends only the right part of the window (see helper.cs)
function regionPx(w, h) {
  if (frameCropped) return { x: 0, y: 0, w, h };
  return { x: Math.round(w * MERCHANT_SIDE), y: 0, w: w - Math.round(w * MERCHANT_SIDE), h };
}

function onVideoFrame(src, fw, fh) {
  const now = performance.now();
  const rp = regionPx(fw, fh);
  if (viewport) track(src, rp, now);
  if (now - lastScan >= (phase === 'scan' ? SCAN_FAST_MS : SCAN_MS)) { lastScan = now; analyze(src, rp); }
}

// A small frame of the visible part of the grid: for scroll tracking and for finding a dragged cargo
function track(src, rp, now) {
  const sw = Math.max(8, Math.round(viewport.w / TRACK_SX)), sh = Math.max(8, Math.round(viewport.h / TRACK_SY));
  if (smallCanvas.width !== sw || smallCanvas.height !== sh) { smallCanvas.width = sw; smallCanvas.height = sh; prevSig = null; ring = []; }
  smallCtx.drawImage(src, rp.x + viewport.x, rp.y + viewport.y, viewport.w, viewport.h, 0, 0, sw, sh);
  const data = smallCtx.getImageData(0, 0, sw, sh).data;
  const small = Vision.toGray(data, sw, sh).g;
  const red = Vision.redness(data, sw, sh);
  const sig = rowSignature(small, sw, sh);
  if (prevSig) {
    const { d } = Vision.estimateShift(prevSig, sig, ROW_BINS, sh, Math.round(sh / 3));
    offset += d * TRACK_SY;
  }
  prevSig = sig;
  ring.push({ t: now, small, red, offset });
  while (ring.length && ring[0].t < now - RING_MS) ring.shift();
}

// Every row of the small frame is squeezed to ROW_BINS means: the shift search gets many times faster
const ROW_BINS = 16;
function rowSignature(g, w, h) {
  const out = new Uint8Array(ROW_BINS * h);
  for (let y = 0; y < h; y++) {
    for (let b = 0; b < ROW_BINS; b++) {
      const x0 = Math.floor(b * w / ROW_BINS), x1 = Math.max(x0 + 1, Math.floor((b + 1) * w / ROW_BINS));
      let s = 0;
      for (let x = x0; x < x1; x++) s += g[y * w + x];
      out[y * ROW_BINS + b] = s / (x1 - x0);
    }
  }
  return out;
}

function analyze(src, rp) {
  if (fullCanvas.width !== rp.w || fullCanvas.height !== rp.h) { fullCanvas.width = rp.w; fullCanvas.height = rp.h; }
  fullCtx.drawImage(src, rp.x, rp.y, rp.w, rp.h, 0, 0, rp.w, rp.h);
  const rgba = fullCtx.getImageData(0, 0, rp.w, rp.h).data;
  const G = Vision.toGray(rgba, rp.w, rp.h);
  // Lines are searched only around the list already found (with a margin for the scrollbar and labels):
  // this is the longest part of the parse. If no grid is found there, the whole right half is searched.
  const roi = viewport && P ? { x0: viewport.x - P, y0: viewport.y - P * 1.5, x1: viewport.x + viewport.w + P * 1.5, y1: viewport.y + viewport.h + P } : null;
  let maps = Vision.lineMaps(G, roi);
  if (!P) {
    P = Vision.detectPeriod(rp.w, rp.h, maps) || 0;
    if (!P) { lastSeen = null; updateStage(); return; }
  }
  const now = performance.now();
  let found = Vision.analyze(G, maps, P);
  if (!found && roi) { maps = Vision.lineMaps(G); found = Vision.analyze(G, maps, P); }
  // The cell size may have been taken from a frame without the merchant (inventory, raid) if catching started earlier:
  // with it the real grid is never found, while random "cargo" do show up. Until the map is ready (or while there is
  // no grid), the size is re-checked now and then, taking the one with which cargo cover a larger area.
  // With plenty of cargo found the grid is real: no re-check.
  if (phase !== 'frozen' && cargo.size < REDETECT_MAX_CARGO && ++checkFrames >= REDETECT_AFTER) {
    checkFrames = 0;
    const P2 = Vision.detectPeriod(rp.w, rp.h, maps);
    if (P2 && Math.abs(P2 - P) > P * 0.1) {
      const alt = Vision.analyze(G, maps, P2);
      if (alt && gridCoverage(alt) > gridCoverage(found) * 1.5) found = alt;
    }
  }
  if (!found) { lostGrid(now); return; }
  // sub-pixel refinements are accepted quietly; a different scale (×2) is a different grid.
  // Nothing but the "Scan again" button touches a ready map: such a frame is simply skipped.
  if (Math.abs(found.P - P) > P * 0.1) {
    if (phase === 'frozen') { lostGrid(now); return; }
    viewport = null; prevSig = null; ring = []; cargo = new Map(); results = new Map(); listTopR = null;
    sbKnown = null; noBarCount = 0; phase = 'scan'; frozenPlaced = null; sawTop = sawEnd = false; stableCount = 0;
  }
  P = found.P;
  const grid = found.grid;
  // cargo in the game is always grey, an empty slot is black (sometimes with a dot).
  // 1×1 is not scanned: reds and anything valuable never drop from it, and confirming and reading them takes time.
  let items = found.items.filter(it => it.occ >= OCC_GREY && it.w * it.h > 1);
  if (!items.length) { lostGrid(now); return; }
  // the merchant was closed and reopened in the middle of a scan: this is a different list
  if (phase !== 'frozen' && gridSeenAt && now - gridSeenAt > REOPEN_MS && cargo.size) { log(tr('log.reopen')); resetScan(); }
  gridSeenAt = now;

  // The visible part of the list. The scrollbar on the right gives it most precisely: the track runs from the top to
  // the bottom of the list, the thumb shows where we are in it. Without a scrollbar (a short list) — the top at first detection:
  // the merchant opens with the list at the top. Above hangs the "Mysterious Supplies" header, through
  // which scrolled cargo shows; it is dropped, and scrolling is tracked only below it.
  // The whole scrollbar is searched once, later only the thumb on the track found. Once the scrollbar has been
  // seen, a frame without a thumb is skipped: another way of counting rows would shift the map.
  let sb = Vision.scrollbar(G, grid, sbKnown);
  if (sb) lastSbTop = sb.thumbTop - sb.trackTop < 2; // for rescan: is the list at its top now
  if (sb && !sbKnown) { sbKnown = { x: sb.x, trackTop: sb.trackTop, trackLen: sb.trackLen, thumbLen: sb.thumbLen }; log(tr('log.bar')); }
  // The thumb length changes only together with the list (after a purchase). Suddenly different: the cursor or
  // a tooltip spoiled the scrollbar, the frame is skipped. A new length is accepted once it holds.
  if (sb && sbKnown && Math.abs(sb.thumbLen - sbKnown.thumbLen) > sbKnown.thumbLen * THUMB_TOLERANCE) {
    thumbOddCount = Math.abs(sb.thumbLen - thumbOddLen) <= 3 ? thumbOddCount + 1 : 1;
    thumbOddLen = sb.thumbLen;
    if (thumbOddCount >= THUMB_NEW_STREAK) sbKnown.thumbLen = sb.thumbLen;
    else sb = null;
  } else thumbOddCount = 0;
  if (!sb && sbKnown) {
    // The price tooltip covered the scrollbar (a cargo near the right edge). The map is left alone, but the tooltip is still
    // read: while the cursor is on a cargo the list does not scroll, so the position is the last known one.
    const last = ring[ring.length - 1];
    if (phase === 'frozen' && now - captureOnset > QUIET_MS && last) { last.offset = offset; detectHover(last); }
    lastSeen = { grid, items }; updateStage(); return;
  }
  if (!sb && ++noBarCount < NO_BAR_LIMIT) { lastSeen = { grid, items }; updateStage(); return; } // still waiting for the scrollbar
  const vpNew = sb
    ? { x: Math.round(grid.x0), y: sb.trackTop, w: Math.round(grid.cols * P), h: sb.trackLen }
    : { x: Math.round(grid.x0), y: Math.round(grid.y0), w: Math.round(grid.cols * P), h: Math.round(grid.rows * P) };
  if (!viewport || (sb && (Math.abs(viewport.y - vpNew.y) > 3 || Math.abs(viewport.h - vpNew.h) > 3))) {
    viewport = vpNew;
    phaseX = grid.x0 % P;
  } else if (!sb && grid.y0 + grid.rows * P > viewport.y + viewport.h + P / 2) {
    viewport.h = Math.round(grid.y0 + grid.rows * P - viewport.y);
  }
  // only cargo within the list: above is under the header, below is the merchant panel
  items = items.filter(it => grid.y0 + it.r * P >= viewport.y - P * 0.2 && grid.y0 + (it.r + it.h) * P <= viewport.y + viewport.h + P * 0.2);

  // row number: from the scrollbar (no error accumulation) or from frame tracking
  const colOf = c => Math.round((grid.x0 + c * P - phaseX) / P);
  let n;
  if (sb) {
    const scrollPx = (sb.thumbTop - sb.trackTop) * sb.trackLen / sb.thumbLen;
    n = Math.round((grid.y0 - sb.trackTop + scrollPx) / P);
    // the list has as many rows as its content length allows; anything else is a recognition error
    const listRows = Math.ceil(sb.trackLen * sb.trackLen / sb.thumbLen / P) + 2;
    if (n < -grid.rows || n > listRows) { lastSeen = { grid, items }; updateStage(); return; }
    listTopR = 0;
    if (scrollPx < P / 2) sawTop = true;
    if (sb.thumbTop + sb.thumbLen >= sb.trackTop + sb.trackLen - 2) sawEnd = true;
  } else {
    n = relocate(items, colOf, Math.round((offset + grid.y0) / P));
    if (listTopR === null) listTopR = n;
    sawTop = sawEnd = true; // the whole list is visible at once
  }
  offset = n * P - grid.y0;
  if (ring.length) ring[ring.length - 1].offset = offset;
  // A cargo touching the top of the visible part may be cut off by the header: the bottom border of
  // the header then acts as its top border. Such a cargo is trusted only in the first row of the list.
  items = items.filter(it => Math.abs(grid.y0 + it.r * P - viewport.y) > P * 0.3 || n + it.r === listTopR);
  lastSeen = { grid, items };
  readFeed(G, grid, now);

  // while a cargo is dragged the picture is "dirty": the map and the references are left alone
  const quiet = now - captureOnset > QUIET_MS;
  const seen = new Set(), fresh = [];
  for (const it of items) {
    const C = colOf(it.c), R = n + it.r;
    const key = `${C},${R},${it.w},${it.h}`;
    const rec = cargo.get(key);
    if (rec) seen.add(key);
    else fresh.push({ key, C, R, it });
  }

  if (phase === 'scan' && quiet) {
    // Nothing is deleted during the scan: some cargo borders come and go, and the map would flicker.
    // Disputes between variants are settled by voting (placedCargo), and a reshuffle by a new scan.
    for (const f of fresh) {
      cargo.set(f.key, { C: f.C, R: f.R, w: f.it.w, h: f.it.h, votes: 0, base: null, thumb: null });
      seen.add(f.key);
    }
    // the map is built: both the top and the bottom of the list were seen, and nothing visible is new or unconfirmed
    const unsure = [...seen].some(k => cargo.get(k).votes + 1 < MIN_VOTES);
    stableCount = unsure ? 0 : stableCount + 1;
    if (sawTop && sawEnd && cargo.size && stableCount >= FREEZE_STABLE) freeze(tr('log.frozen', { n: placedCargo().length }));
  } else if (phase === 'frozen' && quiet) {
    // A frozen map ignores the mouse, price tooltips and purchases: after a purchase
    // the player presses "Scan again". Otherwise a tooltip hanging over cargo would break the map.
    const frozenKeys = new Set(frozenPlaced.map(([k]) => k));
    // Filling in: a missing cargo (say, the top row did not get confirmed before freezing)
    // is added once it has been seen confidently several times and overlaps nothing known.
    // Existing cargo of a ready map never change.
    for (const f of fresh) {
      cargo.set(f.key, { C: f.C, R: f.R, w: f.it.w, h: f.it.h, votes: 0, base: null, thumb: null });
      seen.add(f.key);
    }
    for (const key of seen) {
      const rec = cargo.get(key);
      if (frozenKeys.has(key) || rec.votes + 1 < MIN_VOTES + 2 || overlapsFrozen(rec)) continue;
      frozenPlaced.push([key, rec]);
      frozenKeys.add(key);
    }
  }

  for (const key of seen) {
    const rec = cargo.get(key);
    const it = items.find(i => `${colOf(i.c)},${n + i.r},${i.w},${i.h}` === key);
    rec.votes++;
    rec.seen = now;
    if (!quiet && rec.thumb) continue;
    const x = grid.x0 + it.c * P, y = grid.y0 + it.r * P;
    rec.thumb = makeThumb(x, y, it.w * P, it.h * P);
    updateReveal(rec, Vision.meanColor(rgba, rp.w, x + P * 0.1, y + P * 0.3, it.w * P - P * 0.2, it.h * P - P * 0.4));
    if (quiet) readLabel(rec, x, y, it.w * P, it.h * P);
  }
  // appearance reference of the visible cargo, for finding the dragged one
  const last = ring[ring.length - 1];
  if (quiet && last) for (const key of seen) {
    const rec = cargo.get(key);
    const patch = cargoPatch(rec, last);
    if (!patch) continue;
    const red = Vision.meanOf(cargoPatch(rec, last, 'red'));
    if (red >= RED_MIN) continue; // still red after dragging
    // a price tooltip inside a large cargo does not break its borders: such a frame is not taken as a reference
    if (phase === 'frozen' && rec.base && rec.base.length === patch.length && Vision.patchDiff(patch, rec.base) > BASE_UPDATE_MAX) continue;
    rec.base = patch;
    rec.baseRed = red;
  }
  if (phase === 'frozen' && quiet && last) detectHover(last);
  updateStage();
  if (document.visibilityState === 'visible') drawMap();
}

function overlapsFrozen(rec) {
  return frozenPlaced.some(([, r]) => rec.C < r.C + r.w && r.C < rec.C + rec.w && rec.R < r.R + r.h && r.R < rec.R + rec.h);
}

function freeze(message) {
  if (phase === 'frozen') return;
  frozenPlaced = placedCargo();
  phase = 'frozen';
  log(message);
  updateStage();
}

// Intel: the game paints a revealed cargo in the color of the item quality. The color must hold for several
// parses in a row: the red trace from dragging lasts only briefly.
function updateReveal(rec, [r, g, b]) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0;
  let q = null;
  if (sat > 0.35 && mx > 70) {
    let hue;
    if (mx === r) hue = (60 * (g - b) / (mx - mn) + 360) % 360;
    else if (mx === g) hue = 60 * (b - r) / (mx - mn) + 120;
    else hue = 60 * (r - g) / (mx - mn) + 240;
    q = hue < 12 || hue >= 340 ? 'red' : hue < 70 ? 'gold' : hue < 170 ? 'green' : hue < 255 ? 'blue' : 'purple';
  }
  if (q === rec.revealCand) rec.revealStreak = (rec.revealStreak || 0) + 1;
  else { rec.revealCand = q; rec.revealStreak = 1; }
  if (rec.revealStreak >= REVEAL_STREAK) rec.revealed = q;
}

// Area covered by the cargo found (px²): for the real merchant grid it is large
function gridCoverage(found) {
  if (!found) return 0;
  return found.items.filter(it => it.occ >= OCC_GREY).reduce((a, it) => a + it.w * it.h, 0) * found.P * found.P;
}

function lostGrid(now) {
  lastSeen = null;
  updateStage();
}

// Whether a map cargo is now fully inside the visible part of the list
function fullyVisible(rec, grid, colOf) {
  const top = rec.R * P - offset, bottom = (rec.R + rec.h) * P - offset;
  const c0 = colOf(0), c1 = colOf(grid.cols);
  // at the very top a cargo is not confirmed (see analyze), so it is not considered gone there either
  const clearOfHeader = top > viewport.y + P * 0.3 || rec.R === listTopR;
  return clearOfHeader && top >= viewport.y - 2 && bottom <= Math.min(viewport.y + viewport.h, grid.y0 + grid.rows * P) + 2
    && rec.C >= c0 && rec.C + rec.w <= c1;
}

// If scrolling was not tracked in time (a sharp scroll), look for where the visible cargo match
// the map already found. The layout of cargo sizes is almost always unique.
// The threshold is high: after a purchase cargo are reshuffled, and a weak match elsewhere would be accidental.
function relocate(items, colOf, n) {
  if (items.length < 3 || cargo.size < 3) return n;
  const score = m => items.reduce((s, it) => s + (cargo.has(`${colOf(it.c)},${m + it.r},${it.w},${it.h}`) ? 1 : 0), 0);
  const here = score(n);
  if (here >= items.length * 0.6) return n;
  const rows = [...cargo.values()].map(r => r.R);
  let best = n, bestS = here;
  for (let m = Math.min(...rows) - items.length; m <= Math.max(...rows); m++) {
    const s = score(m);
    if (s > bestS || (s === bestS && Math.abs(m - n) < Math.abs(best - n))) { bestS = s; best = m; }
  }
  return bestS >= Math.max(4, items.length * 0.75) ? best : n;
}

function makeThumb(x, y, w, h) {
  const c = document.createElement('canvas');
  c.width = Math.round(w / P * MAP_U); c.height = Math.round(h / P * MAP_U);
  c.getContext('2d').drawImage(fullCanvas, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

// Cargo rectangle in the small frame (without borders), or null if it is not fully visible
function cargoRect(rec, frameOffset) {
  const x = (phaseX + rec.C * P - viewport.x) / TRACK_SX, y = (rec.R * P - frameOffset - viewport.y) / TRACK_SY;
  const inX = 3 / TRACK_SX, inY = 3 / TRACK_SY;
  const r = {
    x: Math.round(x + inX), y: Math.round(y + inY),
    w: Math.max(1, Math.round(rec.w * P / TRACK_SX - 2 * inX)), h: Math.max(1, Math.round(rec.h * P / TRACK_SY - 2 * inY)),
  };
  if (r.x < 0 || r.y < 0 || r.x + r.w > smallCanvas.width || r.y + r.h > smallCanvas.height) return null;
  return r;
}

function cargoPatch(rec, frame, channel = 'small') {
  const r = cargoRect(rec, frame.offset);
  return r ? Vision.crop({ w: smallCanvas.width, g: frame[channel] }, r.x, r.y, r.w, r.h) : null;
}

// The dragged cargo. When a cargo is dragged, a faint red trace stays in its place,
// and the cargo itself follows the cursor a bit down (onto a neighbour, but grey, so there is no red there).
// A cargo put in the cart keeps a red band all the time: only red that appeared at the sound counts, so the
// red already seen well before the sound is subtracted.
function pickCargo(onset) {
  const frames = ring.filter(f => f.t >= onset - 150 && f.t <= onset + 700);
  if (!frames.length) return null;
  const before = ring.filter(f => f.t >= onset - 2500 && f.t <= onset - 600);
  const red = [], gray = [];
  for (const [key, rec] of placedCargo()) {
    if (!rec.base) continue;
    let r = 0, g = 0, was = rec.baseRed || 0;
    for (const f of before) {
      const rp = cargoPatch(rec, f, 'red');
      if (rp) was = Math.max(was, Vision.meanOf(rp));
    }
    for (const f of frames) {
      const rp = cargoPatch(rec, f, 'red');
      if (rp) r = Math.max(r, Vision.meanOf(rp) - was);
      const gp = cargoPatch(rec, f);
      if (gp && gp.length === rec.base.length) g = Math.max(g, Vision.patchDiff(gp, rec.base));
    }
    red.push({ key, s: r });
    gray.push({ key, s: g });
  }
  // the main sign is the red trace; if it is not visible, the biggest change overall is taken
  return best(red, RED_MIN, 1.5) || best(gray, PICK_MIN_DIFF, 1.25);
}

function best(scored, min, ratio) {
  scored.sort((a, b) => b.s - a.s);
  if (!scored.length || scored[0].s < min) return null;
  if (scored[1] && scored[0].s < scored[1].s * ratio) return null; // two cargo changed equally: no guessing
  return scored[0].key;
}

// Cargo without overlaps. A cargo appears on the map once several frames confirmed it, and in a
// dispute (a border that comes and goes) the variant seen more often wins, so the map does not flicker.
function placedCargo() {
  if (phase === 'frozen' && frozenPlaced) return frozenPlaced; // a ready map does not change until a rescan
  const taken = new Set(), out = [];
  const list = [...cargo.entries()].filter(([, r]) => r.votes >= MIN_VOTES)
    .sort((a, b) => b[1].votes - a[1].votes || (b[1].seen || 0) - (a[1].seen || 0));
  for (const [key, rec] of list) {
    if (splitBetter(rec, list)) continue;
    const cells = [];
    for (let dx = 0; dx < rec.w; dx++) for (let dy = 0; dy < rec.h; dy++) cells.push(`${rec.C + dx},${rec.R + dy}`);
    if (cells.some(c => taken.has(c))) continue;
    cells.forEach(c => taken.add(c));
    out.push([key, rec]);
  }
  return out;
}

// A border between cargo is reliable evidence: it never appears on the grid by itself, but it can vanish under
// a long label. So if a large cargo consists entirely of smaller ones that were also seen often,
// the smaller ones are trusted.
function splitBetter(rec, list) {
  if (rec.w * rec.h < 2) return false;
  const inside = list.map(([, r]) => r).filter(r => r !== rec && r.w * r.h < rec.w * rec.h
    && r.C >= rec.C && r.R >= rec.R && r.C + r.w <= rec.C + rec.w && r.R + r.h <= rec.R + rec.h
    && r.votes >= rec.votes * SPLIT_SHARE);
  // whether they cover every cell of the large one exactly once (greedy, most frequent first)
  const cells = new Map();
  for (const r of inside.sort((a, b) => b.votes - a.votes)) {
    const own = [];
    for (let dx = 0; dx < r.w; dx++) for (let dy = 0; dy < r.h; dy++) own.push(`${r.C + dx},${r.R + dy}`);
    if (own.some(c => cells.has(c))) continue;
    own.forEach(c => cells.set(c, r));
  }
  return cells.size === rec.w * rec.h;
}

function labelName(label) {
  return label.mystery ? MYSTERY_TIERS[label.mystery].name : label.name;
}

// ---------- Price from the tooltip ----------
// Merchant pools matching the cargo price (and label). The merchant adds ~10%, so the tooltip price
// may match a pool price as is or with the markup; the closest is taken.
function poolsForPrice(price, label) {
  let pools = libPools.filter(pl => !profile || String(pl.profile) === String(profile));
  const pl0 = poolLabel(label);
  if (pl0 && pools.some(pl => pl.label)) pools = pools.filter(pl => pl.label === pl0); // the pools of exactly this label
  else if (label && label.mystery) pools = pools.filter(pl => pl.mixed);
  else if (label && label.category) pools = pools.filter(pl => !pl.mixed && pl.categories.includes(label.category));
  if (!pools.length) return [];
  const dist = p => Math.min(Math.abs(Math.log(price / p)), Math.abs(Math.log(price / (p * PRICE_MARKUP))));
  const best = Math.min(...pools.map(pl => dist(pl.price)));
  if (best > PRICE_MATCH_LOG) return [];
  return pools.filter(pl => dist(pl.price) <= best + 1e-9);
}

// Probability of each item among these pools: id → weight
function priceWeights(pools) {
  const out = new Map();
  const tw = pools.reduce((a, pl) => a + pl.weight, 0) || 1;
  for (const pl of pools) {
    const its = pl.items.filter(([id]) => includeBlue || itemQ[id] !== 'blue');
    const tiw = its.reduce((a, [, w]) => a + w, 0) || 1;
    for (const [id, w] of its) out.set(id, (out.get(id) || 0) + pl.weight / tw * w / tiw);
  }
  return out;
}

// Everything known about a cargo for the odds: label, price and item weights by price
function cargoInfo(rec) {
  if (!rec) return null;
  const info = { ...(rec.label || {}) };
  if (rec.price) {
    info.price = rec.price;
    const pools = poolsForPrice(rec.listPrice || rec.price, rec.label); // pools have base prices: the old one on a discount
    if (pools.length) info.priceW = priceWeights(pools);
  }
  return Object.keys(info).length ? info : null;
}

// Red chance of a cargo before any sound: by label, price and size. Without a price the label alone
// gives the pools (all prices of that label).
function cargoRedOdds(rec) {
  const info = cargoInfo(rec);
  if (!info) return null;
  let weights = info.priceW;
  if (!weights) {
    const pl = poolLabel(info);
    if (!pl || ![...itemById.values()].some(it => it.wl)) return info.category ? { red: 0, items: [] } : null;
    weights = new Map();
    for (const it of itemById.values()) { const w = weightOf(it, info); if (w > 0) weights.set(it.id, w); }
  }
  const size = normSize(`${rec.w}x${rec.h}`);
  let total = 0, red = 0;
  const items = [];
  for (const [id, w] of weights) {
    const it = itemById.get(id);
    if (it && normSize(it.size) !== size) continue;
    total += w;
    if (itemQ[id] === 'red') red += w;
    if (it) items.push({ it, p: w });
  }
  if (!total) return null;
  items.forEach(x => { x.p /= total; });
  // purchases of cargo with this label (and about this price) refine the odds, like purchases refine a sound
  const seen = labelCounts(poolLabel(info), rec.price);
  const n = items.reduce((a, x) => a + (seen.get(x.it.id) || 0), 0);
  if (n) items.forEach(x => { x.p = (PRIOR_N * x.p + (seen.get(x.it.id) || 0)) / (PRIOR_N + n); });
  red = items.reduce((a, x) => a + (x.it.q === 'red' ? x.p : 0), 0);
  items.sort((a, b) => order(a.it.q) - order(b.it.q) || b.p - a.p);
  return { red, items };
}

// How many times each item dropped from cargo with this label (and, if given, about this price: within the
// tooltip price tolerance), from the shared base and own purchases: id → count
function labelCounts(label, price) {
  const out = new Map();
  if (!label) return out;
  for (const b of allPurchases()) {
    if (b.label !== label || b.itemId == null) continue;
    if (price && !(b.price && Math.abs(Math.log(b.price / price)) <= PRICE_MATCH_LOG)) continue;
    out.set(b.itemId, (out.get(b.itemId) || 0) + 1);
  }
  return out;
}

// Hover: a price tooltip shows up as cargo that suddenly stopped looking like their reference. It is read,
// and the cargo under the tooltip's top-left corner (where the cursor is) becomes "hovered": the next sound is its.
function detectHover(frame) {
  if (hoverBusy || typeof Ocr === 'undefined' || !libPools.length) return;
  const changed = [];
  for (const [, rec] of placedCargo()) {
    if (!rec.base) continue;
    const p = cargoPatch(rec, frame);
    if (p && p.length === rec.base.length && Vision.patchDiff(p, rec.base) > HOVER_DIFF) changed.push(rec);
  }
  detectHover.changed = changed.length; // for diagnostics
  if (!changed.length || changed.length > HOVER_MAX_CARGO) { hoverSig = ''; return; }
  const sig = changed.map(r => `${r.C},${r.R}`).sort().join(';');
  if (sig === hoverSig) return; // this tooltip was already read
  hoverSig = sig;
  // rectangle of the changed cargo in the frame (with a margin)
  const off = offset, px0 = phaseX;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of changed) {
    x0 = Math.min(x0, px0 + r.C * P); y0 = Math.min(y0, r.R * P - off);
    x1 = Math.max(x1, px0 + (r.C + r.w) * P); y1 = Math.max(y1, (r.R + r.h) * P - off);
  }
  // The tooltip is below and to the right of the cursor, ~3 cells wide and ~1.5 tall. It may extend past
  // the changed cargo (past the grid edge, over empty slots), so at least such a rectangle is cropped;
  // up and left with a margin, as the cursor may be over a cargo that is not on the map.
  x1 = Math.max(x1, x0 + P * TIP_W); y1 = Math.max(y1, y0 + P * TIP_H);
  x0 = Math.max(0, Math.round(x0 - P * 0.4)); y0 = Math.max(0, Math.round(y0 - P * 0.7));
  x1 = Math.min(fullCanvas.width, Math.round(x1 + P * 0.3)); y1 = Math.min(fullCanvas.height, Math.round(y1 + P * 0.3));
  if (x1 - x0 < P / 2 || y1 - y0 < P / 2) return;
  hoverBusy = true;
  // first exactly the tooltip itself (without neighbouring labels), and if it is not visible, the whole patch
  const box = Ocr.findTipBox(fullCanvas, x0, y0, x1 - x0, y1 - y0, P);
  const whole = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  const read = r => { const cv = Ocr.tipCanvas(fullCanvas, r.x, r.y, r.w, r.h, P); return Ocr.readData(cv).then(data => ({ r, data, tip: Ocr.parseTip(data, cv.ocrScale) })); };
  (box ? read(box).then(res => res.tip ? res : read(whole)) : read(whole)).then(({ r, data, tip }) => {
    detectHover.text = data.text; // for diagnostics
    if (!tip) { hoverSig = ''; return; }
    // the cursor is near the tooltip's top-left corner: slightly left of and above the label (or the price line)
    const cx = r.x + (tip.labelBox ? tip.labelBox.x0 - P * 0.25 : tip.priceBox.x0 - P * 0.55);
    const cy = r.y + (tip.labelBox ? tip.labelBox.y0 - P * 0.35 : tip.priceBox.y0 - P * 0.75);
    const C = Math.floor((cx - px0) / P), R = Math.floor((cy + off) / P);
    // with the cursor from the local server the cargo under the mouse is exact; else guessed from the tooltip
    const atCursor = cursorKeyAt(performance.now());
    const hit = atCursor ? [atCursor, cargo.get(atCursor)]
      : placedCargo().find(([, r]) => C >= r.C && C < r.C + r.w && R >= r.R && R < r.R + r.h);
    detectHover.last = { sig, text: data.text, C, R, hit: !!hit }; // for diagnostics
    if (!hit) return;
    const [key, rec] = hit;
    rec.price = tip.price;
    rec.listPrice = tip.listPrice; // a discount: the pool is picked by the old price, the current one is what you pay
    if (tip.label && !rec.label) rec.label = tip.label;
    hover = { key, t: performance.now() };
    rec.hoverAt = Date.now(); // for a purchase made without dragging (ownPurchase)
    showHover(rec);
    if (document.visibilityState === 'visible') drawMap();
  }).catch(() => { hoverSig = ''; }).finally(() => { hoverBusy = false; });
}

// ---------- Cursor ----------
// The local server sends the mouse position (frame px of the captured right part of the game window).
// The cargo under it is the hovered one at once, and at a sound the one under it was picked up.
function onCursor(x, y) {
  const t = performance.now();
  cursorHist.push({ x, y, t });
  while (cursorHist.length > 1 && t - cursorHist[0].t > CURSOR_KEEP_MS) cursorHist.shift();
  const key = cargoAtPoint(x, y);
  if (key === cursorKey) return;
  cursorKey = key;
  if (key) {
    const rec = cargo.get(key);
    hover = { key, t };
    rec.hoverAt = Date.now();
    // the card of the hovered cargo, unless a sound result was shown just now
    if (!lastResult || Date.now() - lastResult.t > CURSOR_CARD_QUIET_MS) showHover(rec);
  }
  if (document.visibilityState === 'visible') drawMap();
}

// The map cargo at a point of the frame (only while the merchant grid is on screen), or null
function cargoAtPoint(x, y) {
  if (!P || !viewport || performance.now() - gridSeenAt > MERCHANT_FRESH_MS) return null;
  if (x < viewport.x || x >= viewport.x + viewport.w || y < viewport.y || y >= viewport.y + viewport.h) return null;
  const C = Math.floor((x - phaseX) / P), R = Math.floor((y + offset) / P);
  const hit = placedCargo().find(([, r]) => C >= r.C && C < r.C + r.w && R >= r.R && R < r.R + r.h);
  return hit ? hit[0] : null;
}

// The cargo that was under the cursor at a moment (performance.now), from the cursor history, or null
function cursorKeyAt(t) {
  let best = null;
  for (const c of cursorHist) if (c.t <= t + 30) best = c; else break;
