    setStatus(tr(stream ? 'status.listening' : 'status.libDone'));
    return true;
  } catch (e) {
    log(tr('log.libFail', { msg: e.message }));
    setStatus(tr('status.importFail'));
    return false;
  }
}

// Бібліотека лежить поруч у папці library: підтягуємо її при кожному запуску (еталони живуть лише
// в памʼяті). Працює через start.bat (localhost); з file:// браузер не дає читати файли — тоді кнопка.
async function autoLoadLibrary() {
  try {
    const res = await fetch('library/groups.json', { cache: 'no-cache' });
    if (!res.ok) return;
    const groupsBlob = await res.blob();
    const groups = JSON.parse(await groupsBlob.text());
    const paths = ['library/merchant.json', 'library/names_ru.json',
      ...groups.groups.flatMap(g => g.sounds.map(s => 'library/' + s.file))];
    const files = [{ path: 'library/groups.json', blob: groupsBlob }];
    await Promise.all(paths.map(async p => {
      const r = await fetch(p);
      if (r.ok) files.push({ path: p, blob: await r.blob() });
    }));
    await importLibrary(files);
  } catch {}
}

function renderProfiles() {
  ui.profile.innerHTML = `<option value="">${esc(tr('opt.allMaps'))}</option>` +
    profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  ui.profile.value = profiles.some(p => String(p.id) === String(profile)) ? String(profile) : '';
  ui.profile.hidden = !profiles.length;
}

// ---------- Утиліти ----------
function pct(x) { return Math.round(x * 100) + '%'; }
// дрібні шанси з десятими, як у грі: 7.4%, 66%
function pctFine(x) { const v = x * 100; return (v < 10 && v > 0 ? v.toFixed(1) : Math.round(v)) + '%'; }
function fmtPrice(x) { return x.toLocaleString(I18n.locale); }
// Назви поточною мовою: англійська — з даних гри, українська й російська — російські назви
// (українських перекладів предметів у даних нема)
function itemName(it) { return I18n.lang === 'en' && it.nameEn ? it.nameEn : it.name; }
function soundName(s) { return I18n.lang === 'en' && s.nameEn ? s.nameEn : s.name; }
function qName(q) { return tr('q.' + q.id); }
function money(x) { return x >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : Math.round(x / 1000) + 'k'; }
function redColor(red) { return red >= 0.5 ? '#ef4444' : red > 0 ? '#f0b429' : '#8b93a1'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function setStatus(s) { ui.status.textContent = s; }
function log(s) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString('uk-UA') + '  ' + s;
  ui.log.prepend(d);
  while (ui.log.children.length > 100) ui.log.lastChild.remove();
}

// ---------- Події ----------
ui.start.onclick = start;
ui.stop.onclick = stop;
ui.rescan.onclick = resetScan;
ui.done.onclick = () => freeze(tr('log.manualFreeze', { n: placedCargo().length }));

$('btnLib').onclick = () => ui.libDir.click();
ui.libDir.onchange = e => {
  const files = [...e.target.files].map(f => ({ path: f.webkitRelativePath || f.name, blob: f }));
  e.target.value = '';
  if (files.length) importLibrary(files);
};
$('blue').checked = includeBlue;
$('blue').onchange = e => {
  includeBlue = e.target.checked;
  try { localStorage.setItem(BLUE_KEY, JSON.stringify(includeBlue)); } catch {}
  renderSounds();
  drawMap();
};
ui.profile.onchange = () => {
  profile = ui.profile.value;
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch {}
  renderSounds();
  drawMap();
};

function addSound() {
  const name = ui.newName.value.trim();
  if (!name) { ui.newName.focus(); return; }
  sounds.unshift({ id: uid(), name, waves: [], items: [] });
  ui.newName.value = '';
  saveSounds();
}
$('btnAdd').onclick = addSound;
ui.newName.addEventListener('keydown', e => { if (e.key === 'Enter') addSound(); });

ui.imgFile.onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f || !imgTarget) return;
  try {
    imgTarget.sound.items[imgTarget.index].img = await resizeImage(f);
    saveSounds();
  } catch (err) { log(tr('log.imgFail', { msg: err.message })); }
  imgTarget = null;
};


// Ручне призначення: клік ставить останній звук на вантаж, правий клік очищає
function mapCargoAt(e) {
  const { minC, minR } = mapBounds();
  const p = canvasPos(ui.map, e);
  const C = minC + Math.floor(p.x * ui.map.width / MAP_U), R = minR + Math.floor(p.y * ui.map.height / MAP_U);
  const hit = placedCargo().find(([, r]) => C >= r.C && C < r.C + r.w && R >= r.R && R < r.R + r.h);
  return hit ? hit[0] : null;
}
ui.map.addEventListener('click', e => {
  const key = mapCargoAt(e);
  if (!key || !lastResult) return;
  if (lastKey && results.get(lastKey) === lastResult) results.delete(lastKey);
  results.set(key, lastResult);
  lastKey = key;
  drawMap();
});
ui.map.addEventListener('mousemove', showMapPop);
ui.map.addEventListener('mouseleave', () => { $('mapPop').hidden = true; });
ui.map.addEventListener('contextmenu', e => {
  e.preventDefault();
  const key = mapCargoAt(e);
  if (!key) return;
  results.delete(key);
  if (key === lastKey) lastKey = null;
  drawMap();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') drawMap(); });

$('btnExport').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 2, sounds })], { type: 'application/json' }));
  a.download = 'abi-ear-sounds.json';
  a.click();
};
$('btnImport').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = normalizeSounds(data.sounds || data);
    const ids = new Set(sounds.map(s => s.id));
    for (const s of incoming) { if (ids.has(s.id)) s.id = uid(); sounds.push(s); }
    saveSounds();
    log(tr('log.imported', { n: incoming.length }));
  } catch (err) { log(tr('log.importFail', { msg: err.message })); }
  e.target.value = '';
};
$('btnClear').onclick = () => {
  if (confirm(tr('confirm.clear'))) { sounds = []; results = new Map(); saveSounds(); }
};
const syncLabels = () => { ui.sensVal.textContent = ui.sens.value + ' ' + tr('unit.db'); ui.thrVal.textContent = ui.thr.value + '%'; };
ui.sens.oninput = ui.thr.oninput = syncLabels;
// Мова інтерфейсу: при зміні перемальовуємо все, де є тексти
const langSelect = $('lang');
langSelect.value = I18n.lang;
langSelect.onchange = () => {
  I18n.setLang(langSelect.value);
  if (stream) showGameStatus(gameStatus);
  syncLabels(); renderProfiles(); renderSounds(); updateStage(); drawMap();
};
I18n.apply();
syncLabels();
renderProfiles();
renderSounds();
autoLoadLibrary();
updateStage();
drawMap();
try { localStorage.removeItem(OLD_REGION_KEY); } catch {}
</script>
